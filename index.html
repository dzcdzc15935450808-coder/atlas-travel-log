    html +=
      '<div class="tl-card reveal ' + j.type + '" data-id="' + j.id + '">' +
        '<div class="tl-when">' +
          '<span class="tl-time ctk" title="点击补时刻">' + esc(j.scheduledDeparture || j.actualDeparture || '--:--') + '</span>' +
          '<span class="tl-sub">' + esc(j.from.code || '') + '</span>' +
        '</div>' +
        '<div class="tl-mid">' +
          '<div class="tl-num"><span class="badge ' + j.type + '">' + ico(isF?'plane':'train') + (isF?'航班':'火车') + '</span>' + esc(j.number) + '</div>' +
          '<div class="tl-op">' + esc(j.operator || '') + (j.vehicle ? ' · ' + esc(j.vehicle) : '') + '</div>' +
          '<div class="tl-route">' + esc((j.from.name || j.from.city || '') + ' → ' + (j.to.name || j.to.city || '')) + '</div>' +
        '</div>' +
        '<div class="tl-end">' +
          '<div class="tl-time ctk" title="点击补时刻">' + esc(j.scheduledArrival || j.actualArrival || '--:--') + '</div>' +
          '<div class="tl-sub">' + esc(j.to.code || '') + '</div>' +
          '<div class="tl-meta">' + (j.distanceKm ? fmtKm(j.distanceKm) + ' · ' : '') + fmtDur(j.durationMinutes) + '</div>' +
        '</div>' +
      '</div>';
  });
  html += '</div>';
  root.innerHTML = html;

  $$('.tl-card', root).forEach(card => {
    card.addEventListener('click', () => {
      const j = findJourney(card.dataset.id);
      if (j) focusJourney(j, true);
    });
  });
  // 点击时间 → 快速补时刻（不用进编辑表单）
  $$('.tl-card .ctk', root).forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    const card = el.closest('.tl-card');
    const j = card && findJourney(card.dataset.id);
    if (j) openQuickTimeEdit(j);
  }));
  observeReveal(root);
}
let revealObserver = null;
function observeReveal(root){
  if (!('IntersectionObserver' in window)){
    $$('.reveal', root).forEach(el => el.classList.add('in'));
    return;
  }
  if (!revealObserver){
    revealObserver = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in'); revealObserver.unobserve(e.target); } });
    }, { rootMargin:'0px 0px -8% 0px', threshold: 0.05 });
  }
  $$('.reveal', root).forEach((el, i) => {
    el.style.transitionDelay = Math.min(i % 12, 6) * 40 + 'ms';
    revealObserver.observe(el);
  });
}
// 快速补时刻：时间线点时间直接改

        '<span class="trip-chip">' + cities.size + ' 个城市</span>' +
      '</div>' +
      '<div class="trip-segs">' + segs.slice(0,6).map(j =>
        '<div class="trip-seg ' + j.type + '">' + ico(j.type==='flight'?'plane':'train') + '<b>' + esc(j.number) + '</b><span>' +
        esc((j.from.city||j.from.code||j.from.name) + ' → ' + (j.to.city||j.to.code||j.to.name)) + '</span></div>'
      ).join('') + (segs.length > 6 ? '<div class="trip-seg"><span>还有 ' + (segs.length-6) + ' 段…</span></div>' : '') + '</div>'
      : '<div class="trip-segs"><span class="rank-empty">还没有行程 — 点「添加行程」从已有行程里挑。</span></div>') +
      '<div class="trip-actions">' +
        '<button class="btn primary small" data-act="add">' + ico('plus') + '添加行程</button>' +
        '<button class="btn small" data-act="view">详情</button>' +
        '<button class="icon-btn" data-act="rename" title="重命名">' + ico('edit') + '</button>' +
        '<button class="icon-btn" data-act="del" title="删除旅途">' + ico('trash') + '</button>' +
      '</div>' +
    '</div>');
  }).join('');
  html += '<button class="trip-new" id="trip-new-card"><span style="font-size:24px">＋</span><span style="font-size:13px;font-weight:600">新建旅途</span><span style="font-size:11px;color:var(--faint)">把多段行程组成一次完整的旅行</span></button>';
  root.innerHTML = html;

  $$('.trip-card', root).forEach(card => {

    if (!trip) return;
    card.addEventListener('click', e => {

      else openTripModal(trip);

function deleteTrip(trip){
  confirmDialog({ title:'删除这段旅途？', msg:'“' + esc(trip.name) + '”将被删除。里面的行程本身会保留。', ok:'删除', danger:true })

/* ============================================================
   STATISTICS  (+ Chart.js monthly chart & mode-share donut)
============================================================ */
let chartMonthly = null, chartDonut = null, statsYear = '';

function computeStats(list){
  const st = {
    total:list.length, flights:0, trains:0, totalKm:0, totalMin:0,
    countries:new Set(), cities:new Set(), airports:new Set(), stations:new Set(),
    airlines:{}, railOps:{}, byCountry:{}, byCity:{}, byAirport:{}, byStation:{},
    longestF:null, longestT:null, byMonth:Array.from({length:12},()=>({f:0,t:0,km:0})),
    topCity:null
  };
  list.forEach(j => {
    if (j.type === 'flight') st.flights++; else st.trains++;
    st.totalKm += +j.distanceKm || 0;
    st.totalMin += +j.durationMinutes || 0;
    const ops = new Set([j.from.country, j.to.country].filter(Boolean));
    ops.forEach(c => st.byCountry[c] = (st.byCountry[c]||0)+1);
    ops.forEach(c => st.countries.add(c));
    const m = monthOf(j);
    if (m != null && m >= 0){ st.byMonth[m].km += +j.distanceKm || 0; j.type==='flight' ? st.byMonth[m].f++ : st.byMonth[m].t++; }
    const isF = j.type === 'flight';
    if (isF){ if (j.operator) st.airlines[j.operator] = (st.airlines[j.operator]||0)+1; }
    else { if (j.operator) st.railOps[j.operator] = (st.railOps[j.operator]||0)+1; }
    [[j.from,1],[j.to,1]].forEach(([p]) => {
      if (!p) return;
      if (p.city){
        st.cities.add(p.city);
        st.byCity[p.city] = (st.byCity[p.city]||0)+1;
      }
      if (p.code){
        const key = p.code + (p.name ? ' · ' + p.name : '');
        if (p.kind === 'station' || (p.kind == null && j.type === 'train')){
          st.stations.add(p.code);
          st.byStation[key] = (st.byStation[key]||0)+1;
        } else {
          st.airports.add(p.code);
          st.byAirport[key] = (st.byAirport[key]||0)+1;
        }
      }
    });
    if (isF && (!st.longestF || (+j.distanceKm||0) > (+st.longestF.distanceKm||0))) st.longestF = j;
    if (!isF && (!st.longestT || (+j.distanceKm||0) > (+st.longestT.distanceKm||0))) st.longestT = j;
  });
  const cityArr = Object.entries(st.byCity).sort((a,b)=>b[1]-a[1]);
  if (cityArr.length) st.topCity = cityArr[0];
  return st;
}
function rankRows(obj, max){
  const arr = Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0, 8);
  if (!arr.length) return '<div class="rank-empty">暂无数据。</div>';
  const top = max || arr[0][1] || 1;
  return arr.map(([name,n]) =>
    '<div class="rank-row"><div class="rank-name">' + esc(name) + '</div><div class="rank-n">' + n + '</div>' +
    '<div class="rank-track"><div class="rank-fill" style="width:' + Math.round(n/top*100) + '%"></div></div></div>'
  ).join('');
}
function renderStats(){

      sumCell(st.countries.size,'国家') + sumCell(st.cities.size,'城市') +
      sumCell(st.airports.size,'机场') + sumCell(st.stations.size,'火车站') +
    '</div></div>' +
    '<div class="stats-section"><h3>纪录</h3><div class="rec-grid">' +
      '<div class="rec-card glass flight"><div class="rec-lab">最长航班</div>' + recCard(recF, 'plane') + '</div>' +
      '<div class="rec-card glass train"><div class="rec-lab">最长火车</div>' + recCard(recT, 'train') + '</div>' +
      '<div class="rec-card glass"><div class="rec-lab">最常到访城市</div>' +
        (st.topCity
          ? '<div class="rec-route">' + ico('pin') + esc(st.topCity[0]) + '</div><div class="rec-val">' + '到访 ' + st.topCity[1] + ' 次</div><div class="rec-sub">' + (statsYear ? statsYear + ' 年内' : '全部时间') + '</div>'
          : '<div class="rank-empty">暂无数据。</div>') +
      '</div>' +
    '</div></div>' +
    '<div class="stats-section"><h3>月度出行' + (statsYear ? ' · ' + esc(statsYear) + ' 年' : '') + '</h3><div class="charts-grid">' +
      '<div class="chart-card glass"><div class="chart-box"><canvas id="chart-monthly"></canvas></div></div>' +
      '<div class="chart-card glass"><div class="donut-toggle"><button id="donut-trips" class="active">按次数</button><button id="donut-dist">按距离</button></div><div class="chart-box"><canvas id="chart-donut"></canvas></div></div>' +
    '</div></div>' +
    '<div class="stats-section"><h3>航空公司</h3><div class="rank-grid"><div class="rank-card glass">' + rankRows(st.airlines) + '</div></div></div>' +
    '<div class="stats-section"><h3>铁路运营商</h3><div class="rank-grid"><div class="rank-card glass train">' + rankRows(st.railOps) + '</div></div></div>' +
    '<div class="stats-section"><h3>国家</h3><div class="rank-grid"><div class="rank-card glass">' + rankRows(st.byCountry) + '</div></div></div>' +

function drawDonut(st, mode){

  list.forEach(j => { if (j.type === 'flight') fKm += +j.distanceKm||0; else tKm += +j.distanceKm||0; });
  const data = mode === 'trips' ? [f, t] : [Math.round(fKm), Math.round(tKm)];

          const tot = c.dataset.data.reduce((a,b)=>a+b,0) || 1;

        } } } } }
  });
}

/* ============================================================
   REPLAY ENGINE
   (flight-footprint style playback; Flight Footprints inspired)
============================================================ */
const Replay = {
  active:false, segs:[], idx:0, t:0, playing:true, speed:1, title:'',
  group:null, vehicle:null, lines:[], raf:0, lastTs:0, phase:'move', dwellT:0, segDur:6000,
  _clock:0, _dragging:false, _needsRender:false, _hudTick:0,

  start(opts){
    const journeys = (opts.journeys || []).filter(j => validGeo(j.from) && validGeo(j.to));
    if (!journeys.length){ toast('暂无可回放的行程', 'error'); return; }
    if (!world || typeof THREE === 'undefined'){ toast('3D 引擎不可用，无法回放', 'error'); return; }
    switchView('globe');
    this.stop(true);
    this.active = true;
    this.title = opts.title || '回放';
    this.speed = 1;
    this.idx = 0; this.t = 0; this.phase = 'intro'; this.dwellT = 1.15;
    this._clock = 0; this._dragging = false; this._needsRender = true; this._hudTick = 0;
    document.body.classList.add('replaying');

    this.segs = sortedJourneys(journeys).map(j => this.precompute(j));
    this.group = new THREE.Group();
    world.scene().add(this.group);
    this.vehicle = buildVehicleMesh(this.segs[0].j.type);
    this.vehicle.visible = false;
    world.scene().add(this.vehicle);

    setAutoRotate(false);
    // 回放期间接管相机：关闭轨道控制器，避免阻尼与逐帧相机互相拉扯造成卡顿
    const ctr = world.controls();
    this._ctr = { enabled: ctr.enabled, damping: ctr.enableDamping };
    ctr.enabled = false;
    ctr.enableDamping = false;
    this._slider = $('#rp-slider');
    $('#rp-speed').textContent = '1×';
    $('#replay-dock').classList.remove('hidden');
    this.renderHud();
    this.updateSlider();
    flyTo(this.segs[0].j.from.lat, this.segs[0].j.from.lng, 1.55, 1100);
    // hide the static network so the replay can grow it segment by segment
    world.arcsData([]); world.pathsData([]);
    this.lastTs = performance.now();
    this.playing = true;
    this.setPlayIcon();
    const first = this.segs[0];
    ringAt(first.j.from.lat, first.j.from.lng, this.segColor(first.j), 3400);
    const self = this;
    this.raf = requestAnimationFrame(ts => self.frame(ts));
  },

  precompute(j){
    const N = j.type === 'flight' ? 72 : clamp(Math.round(haversine(j.from, j.to) / 80), 24, 140);
    const pts = [];
    const dist = haversine(j.from, j.to);
    let geom = null;
    if (j.type === 'train'){
      const tp = trainPathPoints(j);
      if (tp.length > 1) geom = tp;
    }
    for (let i=0;i<=N;i++){
      const s = i/N;
      if (geom){
        const idx = s * (geom.length - 1);
        const i0 = Math.floor(idx), i1 = Math.min(geom.length-1, i0+1), f = idx - i0;
        const lat = geom[i0][0] + (geom[i1][0]-geom[i0][0]) * f;
        const lng = geom[i0][1] + (geom[i1][1]-geom[i0][1]) * f;
        pts.push([lat, lng, 0.003]);
      } else {
        const p = slerpLL(j.from.lat, j.from.lng, j.to.lat, j.to.lng, s);
        const alt = 0.012 + Math.sin(s * Math.PI) * clamp(0.03 + dist/34000, 0.10, 0.30);
        pts.push([p.lat, p.lng, alt]);
      }
    }
    const coords = pts.map(p => { const c = world.getCoords(p[0], p[1], p[2]); return new THREE.Vector3(c.x, c.y, c.z); });
    const cum = [0];
    for (let i=1;i<coords.length;i++) cum.push(cum[i-1] + coords[i].distanceTo(coords[i-1]));
    return { j, pts, coords, cum, total: cum[cum.length-1] || 1, line:null };
  },

  segColor(j){ return j.type === 'flight' ? 0x7d97ff : 0xffc266; },

  ensureLine(seg, frac, done){
    if (!seg.line){
      const g = new THREE.BufferGeometry().setFromPoints(seg.coords);
      const m = new THREE.LineBasicMaterial({ color:this.segColor(seg.j), transparent:true, opacity: done ? 0.42 : 0.95 });
      seg.line = new THREE.Line(g, m);
      this.group.add(seg.line);
    }
    seg.line.material.opacity = done ? 0.42 : 0.95;
    const n = seg.coords.length;
    seg.line.geometry.setDrawRange(0, Math.max(2, Math.round(n * clamp(frac,0,1))));
  },

  pointOn(seg, s){
    s = clamp(s, 0, 1);
    const target = s * seg.total;
    let lo = 0, hi = seg.cum.length - 1;
    while (lo < hi){ const mid = (lo+hi) >> 1; if (seg.cum[mid] < target) lo = mid+1; else hi = mid; }
    const i = Math.max(1, lo);
    const c0 = seg.cum[i-1], c1 = seg.cum[i];
    const f = c1 > c0 ? (target - c0) / (c1 - c0) : 0;
    return { pos: seg.coords[i-1].clone().lerp(seg.coords[i], f), i, f };
  },

  frame(ts){
    if (!this.active) return;
    // 绝对时钟推进：即使掉帧，位置也直接跳到正确时间点，不会累积错位
    const dt = Math.min(250, ts - this.lastTs) / 1000;
    this.lastTs = ts;
    if (this.phase === 'intro'){
      this.dwellT -= dt;
      if (this.dwellT <= 0) this.phase = 'move';
    } else if (this.playing && !this._dragging){
      if (this.phase === 'dwell'){
        this.dwellT -= dt * this.speed * state.settings.animSpeed;
        if (this.dwellT <= 0) this.nextSeg(true);
      } else if (this.phase === 'move'){
        this._clock += dt * this.speed * state.settings.animSpeed * 1000;
        this.t = clamp(this._clock / this.segDur, 0, 1);
        if (this.t >= 1) this.completeSeg();
      }
    }
    // HUD 降频回写（每 0.12s 一次），减少每帧 DOM 重排
    this._hudTick += dt;
    const hudDue = this._hudTick >= 0.12;
    if (hudDue) this._hudTick = 0;
    if (this.playing || this.phase === 'intro' || this._needsRender){
      this.render(hudDue);
      this._needsRender = false;
    }
    const self = this;
    this.raf = requestAnimationFrame(t => self.frame(t));
  },

  render(hudNow){
    const seg = this.segs[this.idx];
    if (!seg) return;
    const e = this.t < 0 ? 0 : this.t;
    const ease = e <= 0 ? 0 : (e >= 1 ? 1 : (e*e*(3-2*e))*0.25 + e*0.75);
    // draw completed segments + current
    this.segs.forEach((s2, i) => {
      if (i < this.idx) this.ensureLine(s2, 1, true);
      else if (i === this.idx) this.ensureLine(s2, ease, false);
      else if (s2.line) { this.group.remove(s2.line); s2.line.geometry.dispose(); s2.line = null; }
    });
    const p = this.pointOn(seg, ease);
    const ahead = this.pointOn(seg, Math.min(1, ease + 0.004));
    this.vehicle.visible = this.phase === 'move' && this.t >= 0;
    this.vehicle.position.copy(p.pos);
    if (ahead.pos.distanceToSquared(p.pos) > 1e-10) this.vehicle.lookAt(ahead.pos);

    if (this.playing || this.phase !== 'intro'){
      // 直接驱动相机，绕过逐帧 tween；配合已禁用的轨道控制器，全程丝滑
      const alt = 1.55 + 0.22 * Math.sin(Math.PI * ease);
      const i = Math.round(ease * (seg.pts.length - 1));
      const c = world.getCoords(seg.pts[i][0], seg.pts[i][1], alt);
      world.camera().position.set(c.x, c.y, c.z);
      world.camera().lookAt(0, 0, 0);
    }
    // hud（降频回写，减少每帧 DOM 重排）
    if (hudNow !== false){
      if (this._bar) this._bar.style.width = (((this.idx + ease) / this.segs.length) * 100).toFixed(1) + '%';
      this.updateSlider(ease);
    }
  },

  completeSeg(){
    const seg = this.segs[this.idx];
    this.ensureLine(seg, 1, true);
    ringAt(seg.j.to.lat, seg.j.to.lng, this.segColor(seg.j) === 0x7d97ff ? 'rgba(125,151,255,0.85)' : 'rgba(255,194,102,0.85)', 2200);
    if (this.idx >= this.segs.length - 1){
      this.playing = false;
      this.phase = 'done';
      this.renderHud();
      toast('回放完成 — ' + this.title);
      return;
    }
    this.phase = 'dwell';
    this.dwellT = 0.3;
  },

  nextSeg(fromAuto){
    if (this.idx >= this.segs.length - 1){ this.playing = false; this.setPlayIcon(); return; }
    this.idx++;
    this.t = 0;
    this._clock = 0;
    this.phase = 'move';
    const seg = this.segs[this.idx];
    this.segDur = clamp(4200 + haversine(seg.j.from, seg.j.to) / 9000 * 2600, 3800, 11000);
    this.renderHud();
    ringAt(seg.j.from.lat, seg.j.from.lng, this.segColor(seg.j) === 0x7d97ff ? 'rgba(125,151,255,0.85)' : 'rgba(255,194,102,0.85)', 2400);
  },

  goto(idx){
    idx = clamp(idx, 0, this.segs.length - 1);
    if (idx === this.idx && this.phase === 'move') return;
    // remove lines beyond
    this.segs.forEach((s2, i) => {
      if (i > idx && s2.line){ this.group.remove(s2.line); s2.line.geometry.dispose(); s2.line = null; }
    });
    this.idx = idx; this.t = 0;
    this.phase = 'move';
    this._clock = 0;
    const seg = this.segs[this.idx];
    this.segDur = clamp(4200 + haversine(seg.j.from, seg.j.to) / 9000 * 2600, 3800, 11000);
    this.renderHud();
    if (!this.playing) this.render();
  },

  scrub(frac){
    const target = clamp(frac, 0, 1) * (this.segs.length - 1) + (frac >= 1 ? 0.999 : 0);
    const idx = Math.floor(target);
    this.goto(idx);
    this.t = target - idx;
    this.phase = 'move';
    this._clock = this.t * this.segDur;
    this.render(true);
  },

  renderHud(){
    const seg = this.segs[this.idx];
    if (!seg) return;
    const j = seg.j;
    $('#replay-hud').classList.remove('hidden');
    $('#replay-hud').innerHTML =
      '<div class="rh-title">' + esc(this.title) + '</div>' +
      '<div class="rh-seg">' + ico(j.type === 'flight' ? 'plane' : 'train') + ' ' + esc(j.number) + ' <span style="color:var(--muted);font-weight:500">· ' + esc(j.operator || '') + '</span></div>' +
      '<div class="rh-sub">' + esc((j.from.city || j.from.name) + ' → ' + (j.to.city || j.to.name)) + ' · ' + fmtDate(j.date) + '</div>' +
      '<div class="rh-bar"><i></i></div>';
    $('#rp-count').textContent = (this.idx + 1) + ' / ' + this.segs.length;
    this._bar = $('#replay-hud .rh-bar i');
  },

  updateSlider(ease){
    if (this._dragging) return; // 用户正在拖动时不回写，避免顶手
    const sl = this._slider || (this._slider = $('#rp-slider'));
    const frac = (this.idx + (ease || this.t || 0)) / this.segs.length;
    if (document.activeElement !== sl) sl.value = Math.round(frac * 1000);
  },

  setPlayIcon(){
    $('#rp-play').innerHTML = this.playing ? ico('pause') : ico('play');
  },

  togglePlay(){
    if (this.phase === 'done'){
      this.idx = 0; this.t = 0; this.phase = 'move';
      this.segs.forEach(s2 => { if (s2.line){ this.group.remove(s2.line); s2.line.geometry.dispose(); s2.line = null; } });
    }
    this.playing = !this.playing;
    if (this.playing){
      this.phase = 'move';
      this._clock = (this.t || 0) * this.segDur;
    }
    this.setPlayIcon();
    this._needsRender = true;
  },

  exit(){
    this.stop();
    document.body.classList.remove('replaying');
    updateGlobeLayers();
    updateDashboard();
    flyTo(26, 8, 2.75, 1200);
    queueAutoRotate();
  },

  stop(silent){
    this.active = false;
    cancelAnimationFrame(this.raf);
    // 归还相机控制权
    if (world && this._ctr){
      const ctr = world.controls();
      ctr.enabled = this._ctr.enabled;
      ctr.enableDamping = this._ctr.damping;
      this._ctr = null;
    }
    if (this.group && world){
      world.scene().remove(this.group);
      this.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose && o.material.dispose(); });
    }
    if (this.vehicle && world) world.scene().remove(this.vehicle);
    this.group = null; this.vehicle = null;
    this.segs = [];
    $('#replay-dock').classList.add('hidden');
    $('#replay-hud').classList.add('hidden');
    if (!silent) document.body.classList.remove('replaying');
  }
};

function buildVehicleMesh(type){
  const g = new THREE.Group();
  if (type === 'train'){
    // Simple high-speed / conventional train slug — nose +z
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.0, 3.6), new THREE.MeshBasicMaterial({ color: 0xffd27e }));
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.52, 1.4, 4), new THREE.MeshBasicMaterial({ color: 0xffe3ae }));
    nose.rotation.x = Math.PI / 2;
    nose.rotation.z = Math.PI / 4;
    nose.position.z = 2.4;
    g.add(body, nose);
    g.scale.setScalar(1.15);
  } else {
    // Stylized plane: fuselage + wings + tail — nose +z
    const mat = new THREE.MeshBasicMaterial({ color: 0xdfe7ff });
    const fus = new THREE.Mesh(new THREE.ConeGeometry(0.42, 3.4, 5), mat);
    fus.rotation.x = Math.PI / 2;
    const wings = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.07, 1.0), mat);
    wings.position.z = -0.35;
    const tail = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.06, 0.6), mat);
    tail.position.z = -1.45;
    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.85, 0.65), mat);
    fin.position.set(0, 0.42, -1.45);
    g.add(fus, wings, tail, fin);
    g.scale.setScalar(1.0);
  }
  return g;
}

function openReplayPicker(){
  const years = [...new Set(state.journeys.map(yearOf).filter(Boolean))].sort((a,b)=>b-a);
  const trips = state.trips.slice();
  let html =
    '<div class="modal-head"><div><div class="modal-kicker">影像化回放</div><div class="modal-title">回放你的旅程</div></div>' +
    '<button class="icon-btn modal-close">' + ico('x') + '</button></div><div class="modal-body">';
  html += '<div class="form-section"><h4>按时间</h4><div class="year-chips" style="margin-bottom:0">' +
    '<button class="stat-chip" data-replay="all">全部时间</button>' +
    years.map(y => '<button class="stat-chip" data-replay="' + y + '">' + y + '</button>').join('') + '</div></div>';
  html += '<div class="form-section"><h4>旅途</h4><div class="jd-list">';
  html += trips.length ? trips.map(t => {
    const segs = tripSegments(t);
    return '<button class="sr-item" data-trip="' + t.id + '"><span class="sr-ic place">' + ico('route') + '</span>' +
      '<span style="flex:1"><b>' + esc(t.name) + '</b><span>' + segs.length + ' 段行程 · ' + fmtDate(segs[0] && segs[0].date) + '</span></span></button>';
  }).join('') : '<div class="rank-empty">暂无旅途。</div>';
  html += '</div></div></div>';

  const ov = openModal(html, { size:'mid' });
  $$('[data-replay]', ov).forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.replay;
    const list = v === 'all' ? state.journeys : state.journeys.filter(j => String(yearOf(j)) === v);
    closeModal(ov);
    Replay.start({ title: v === 'all' ? '全部时间回放' : v + ' 年回放', journeys: list });
  }));
  $$('[data-trip]', ov).forEach(b => b.addEventListener('click', () => {
    const trip = state.trips.find(t => t.id === b.dataset.trip);
    closeModal(ov);
    if (trip) Replay.start({ title: trip.name, journeys: tripSegments(trip) });
  }));
}
/* ============================================================
   MODALS — framework
============================================================ */
function openModal(html, opts){
  opts = opts || {};
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = '<div class="modal ' + (opts.size||'') + '">' + html + '</div>';
  $('#modal-root').appendChild(ov);
  requestAnimationFrame(() => ov.classList.add('show'));
  ov.addEventListener('mousedown', e => { if (e.target === ov) closeModal(ov); });
  const x = ov.querySelector('.modal-close');
  if (x) x.addEventListener('click', () => closeModal(ov));
  return ov;
}
function closeModal(ov){
  if (!ov) return;
  ov.classList.remove('show');
  setTimeout(() => ov.remove(), 230);
}
function closeAllModals(){ $$('#modal-root .modal-overlay').forEach(m => closeModal(m)); }
function confirmDialog(opts){
  return new Promise(resolve => {
    const ov = openModal(
      '<div class="modal-body" style="padding-top:24px">' +
        '<div class="modal-title" style="font-size:16px;margin-bottom:10px">' + opts.title + '</div>' +
        '<div class="muted" style="font-size:13px;line-height:1.6">' + opts.msg + '</div>' +
      '</div>' +
      '<div class="modal-foot" style="border-top:none;padding-top:0">' +
        '<button class="btn" data-c="0">取消</button>' +
        '<button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" data-c="1">' + esc(opts.ok || '确认') + '</button>' +
      '</div>', { size:'small' });
    $$('[data-c]', ov).forEach(b => b.addEventListener('click', () => { closeModal(ov); resolve(b.dataset.c === '1'); }));
  });
}
function toast(msg, type){
  const root = $('#toast-root');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.innerHTML = '<i></i>' + msg;
  root.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 3400);
}

function mergeForm(form, j){
  const set = (n, v) => { const el = form.elements[n]; if (el && v != null) el.value = v; };
  ['number','date','operator','operatorCode','category','scheduledDeparture','actualDeparture',
   'scheduledArrival','actualArrival','durationMinutes','distanceKm','vehicle','registration','coach',
   'seat','travelClass','bookingReference','notes'].forEach(k => set(k, j[k]));
  [['from','from'],['to','to']].forEach(([src, side]) => {
    set(side + 'Name', j[src].name); set(side + 'Code', j[src].code); set(side + 'Icao', j[src].icao);
    set(side + 'City', j[src].city); set(side + 'Country', j[src].country);
    set(side + 'Lat', j[src].lat); set(side + 'Lng', j[src].lng);
  });
  if (form.elements.geometry && j.geometry) form.elements.geometry.value = JSON.stringify(j.geometry);
}
function saveJourneyForm(ov, form, target, isNew){
  const val = n => (form.elements[n] ? String(form.elements[n].value).trim() : '');
  const num = n => { const v = parseFloat(val(n)); return isFinite(v) ? v : null; };
  // validate coordinates
  let bad = false;
  [['fromLat','fromLng','出发地'],['toLat','toLng','目的地']].forEach(([la, ln, label]) => {
    const ok = num(la) != null && num(ln) != null;
    if (!ok && !bad){
      form.elements[la].classList.add('err');
      form.elements[ln].classList.add('err');
      toast(label + '坐标必填，否则无法绘制线路', 'error');
      bad = true;
    }
  });
  if (bad) return;

  let geometry = null;
  if (form.elements.geometry && val('geometry')){
    try{
      const g = JSON.parse(val('geometry'));
      if (!Array.isArray(g) || !g.every(p => Array.isArray(p) && p.length >= 2)) throw new Error('shape');
      geometry = g.map(p => [+p[0], +p[1]]);
    }catch(e){
      toast('线路途经点必须是 JSON 数组，格式为 [[经度, 纬度], …]', 'error');
      return;
    }
  }

  const patch = {
    type: target.type,
    number: val('number'),
    date: val('date'),
    operator: val('operator'),
    operatorCode: val('operatorCode'),
    category: target.type === 'train' ? (val('category') || 'rail') : 'air',
    scheduledDeparture: val('scheduledDeparture'),
    actualDeparture: val('actualDeparture'),
    scheduledArrival: val('scheduledArrival'),
    actualArrival: val('actualArrival'),
    durationMinutes: num('durationMinutes') || 0,
    distanceKm: num('distanceKm') || 0,
    vehicle: val('vehicle'),
    registration: val('registration'),
    coach: val('coach'),
    seat: val('seat'),
    travelClass: val('travelClass'),
    bookingReference: val('bookingReference'),
    notes: val('notes'),
    geometry
  };
  ['from','to'].forEach(side => {
    const S = side === 'from' ? 'from' : 'to';
    patch[side] = {
      name: val(S + 'Name'), code: val(S + 'Code').toUpperCase(), icao: val(S + 'Icao').toUpperCase(),
      city: val(S + 'City'), country: val(S + 'Country'), lat: num(S + 'Lat'), lng: num(S + 'Lng')
    };
  });

  if (isNew){
    state.journeys.push(makeJourney(Object.assign({}, patch, { type: target.type, tripId: target.tripId || null })));
    toast('行程已添加', 'success');
  } else {
    Object.assign(target, patch);
    toast('行程已更新', 'success');
  }
  persist();
  closeModal(ov);
  rebuildAll();
}

   IMPORT / EXPORT
============================================================ */
function downloadFile(name, content, mime){
  const blob = new Blob([content], { type: mime || 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
function exportPayload(){
  return JSON.stringify({ app:'personal-travel-atlas', version:1, exportedAt:new Date().toISOString(),
    journeys: state.journeys, trips: state.trips }, null, 2);
}
function exportJSON(){ downloadFile('travel-data.json', exportPayload()); toast('已导出 travel-data.json', 'success'); }
function exportBackup(){ downloadFile('atlas-backup.json', exportPayload()); toast('备份已保存', 'success'); }
function exportCSV(){
  const cols = ['id','type','date','number','operator','fromName','fromCode','fromCity','fromCountry','fromLat','fromLng',
    'toName','toCode','toCity','toCountry','toLat','toLng','scheduledDeparture','actualDeparture','scheduledArrival',
    'actualArrival','durationMinutes','distanceKm','vehicle','registration','coach','seat','travelClass','bookingReference','notes'];
  const get = (j, c) => {
    if (c.startsWith('from')) { const k = c[4].toLowerCase() + c.slice(5); return j.from[k]; }
    if (c.startsWith('to'))   { const k = c[2].toLowerCase() + c.slice(3); return j.to[k]; }
    return j[c];
  };
  const q = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const csv = [cols.join(',')].concat(sortedJourneys().map(j => cols.map(c => q(get(j, c))).join(','))).join('\n');
  downloadFile('travel-data.csv', csv, 'text/csv');
  toast('已导出 travel-data.csv', 'success');
}
function importJSONFile(file){
  const reader = new FileReader();
  reader.onload = async () => {
    let data;
    try{ data = JSON.parse(reader.result); }
    catch(e){ toast('该文件不是有效的 JSON', 'error'); return; }
    const journeys = Array.isArray(data) ? data : (data && data.journeys);
    const trips = data && Array.isArray(data.trips) ? data.trips : null;
    if (!Array.isArray(journeys)){
      toast('文件中未找到行程 — 需要 JSON 数组或 {journeys:[…]} 结构', 'error');
      return;
    }
    const clean = journeys.filter(j => j && j.from && j.to);
    const ok = await confirmDialog({
      title:'导入 ' + clean.length + ' 段行程？',
      msg:'将替换当前数据（现有 ' + state.journeys.length + ' 段行程、' + state.trips.length + ' 个旅途）。不确定请先导出备份。',
      ok:'导入', danger:false });
    if (!ok) return;
    state.journeys = clean.map(j => makeJourney({
      id: j.id || uid(), type: j.type === 'train' ? 'train' : 'flight',
      date: j.date || '', number: j.number || '', operator: j.operator || '', operatorCode: j.operatorCode || '',
      category: j.category || '', from: j.from || {}, to: j.to || {},
      scheduledDeparture: j.scheduledDeparture || '', actualDeparture: j.actualDeparture || '',
      scheduledArrival: j.scheduledArrival || '', actualArrival: j.actualArrival || '',
      durationMinutes: +j.durationMinutes || 0, distanceKm: +j.distanceKm || 0,
      vehicle: j.vehicle || '', registration: j.registration || '', coach: j.coach || '',
      seat: j.seat || '', travelClass: j.travelClass || '', bookingReference: j.bookingReference || '',
      notes: j.notes || '', tripId: j.tripId || null, geometry: Array.isArray(j.geometry) ? j.geometry : null
    }));
    state.trips = trips ? trips.filter(t => t && t.id && t.name).map(t => ({ id:t.id, name:t.name, createdAt:t.createdAt || Date.now() })) : [];
    state.journeys.forEach(j => { if (j.tripId && !state.trips.some(t => t.id === j.tripId)) j.tripId = null; });
    store.save(LS.meta, { seeded:true });
    persist();
    statsYear = '';
    rebuildAll();
    toast('已导入 ' + state.journeys.length + ' 段行程', 'success');
  };
  reader.onerror = () => toast('无法读取该文件', 'error');
  reader.readAsText(file);
}
async function clearAll(){
  const ok = await confirmDialog({
    title:'清空全部数据？',
    msg:'所有行程与旅途都将从浏览器中永久删除。建议先导出一份备份。',
    ok:'全部删除', danger:true });

  state.journeys = [];
  state.trips = [];
  state.filterYear = null;
  statsYear = '';
  store.save(LS.meta, { seeded:true }); // do not re-seed samples after an explicit clear

  rebuildAll();
  toast('已清空全部数据');
}

function initSearch(){
  const inp = $('#search-input'), box = $('#search-results');
  const run = debounce(() => {
    const q = inp.value.trim().toLowerCase();
    if (q.length < 1){ box.classList.remove('open'); return; }
    const all = state.journeys;
    const jHits = all.filter(j =>
      normNum(j.number).includes(normNum(q)) ||
      (j.operator||'').toLowerCase().includes(q) ||
      ['from','to'].some(side => [j[side].city, j[side].country, j[side].code, j[side].name, j[side].icao]
        .some(v => (v||'').toLowerCase().includes(q)))
    ).slice(0, 7);
    const cityHits = Object.values(cityIndexRaw()).filter(c => c.name.toLowerCase().includes(q) || (c.country||'').toLowerCase().includes(q)).slice(0, 5);
    let html = '';
    if (jHits.length){
      html += '<div class="sr-group">行程</div>' + jHits.map(j =>
        '<button class="sr-item" data-j="' + j.id + '"><span class="sr-ic ' + j.type + '">' + ico(j.type === 'flight' ? 'plane' : 'train') + '</span>' +
        '<span style="flex:1;min-width:0"><b>' + esc(j.number) + '</b><span>' + esc((j.from.city||j.from.name||'') + ' → ' + (j.to.city||j.to.name||'')) + ' · ' + fmtDate(j.date) + '</span></span></button>'
      ).join('');
    }
    if (cityHits.length){
      html += '<div class="sr-group">城市</div>' + cityHits.map(c =>
        '<button class="sr-item" data-c="' + esc(c.key) + '"><span class="sr-ic place">' + ico('pin') + '</span>' +
        '<span style="flex:1"><b>' + esc(c.name) + '</b><span>' + esc(c.country) + ' · ' + '到访 ' + c.visits + ' 次</span></span></button>'
      ).join('');
    }
    box.innerHTML = html || '<div class="sr-empty">未找到与“' + esc(inp.value) + '”匹配的结果</div>';
    box.classList.add('open');
    $$('[data-j]', box).forEach(b => b.addEventListener('mousedown', () => {
      const j = findJourney(b.dataset.j);
      box.classList.remove('open'); inp.value = '';
      if (j) focusJourney(j, true);
    }));
    $$('[data-c]', box).forEach(b => b.addEventListener('mousedown', () => {
      const c = cityIndex[b.dataset.c];
      box.classList.remove('open'); inp.value = '';
      if (c) focusCity(c, true);
    }));
  }, 140);
  inp.addEventListener('input', run);
  inp.addEventListener('focus', run);
  document.addEventListener('mousedown', e => { if (!e.target.closest('.search-wrap')) box.classList.remove('open'); });
}
// full index over ALL journeys (ignores time machine) for search
function cityIndexRaw(){
  const idx = {};
  state.journeys.forEach(j => {
    [j.from, j.to].forEach(p => {
      if (!p || !p.city) return;
      const key = (p.city + '|' + (p.country||'')).toLowerCase();
      if (!idx[key]) idx[key] = { key, name:p.city, country:p.country||'', lat:p.lat, lng:p.lng, visits:0, journeys:[] };
      idx[key].visits++;
      idx[key].journeys.push(j);
    });
  });
  return idx;
}

  $('#zoom-out').addEventListener('click', () => zoomBy(1.28));
  $('#zoom-reset').addEventListener('click', () => { if (world) flyTo(26, 8, 2.75, 900); });
  $('#globe-container').addEventListener('dblclick', () => { if (world) flyTo(26, 8, 2.75, 900); });

  // globe error fallbacks
  $('#btn-globe-retry').addEventListener('click', () => location.reload());
  $('#btn-globe-skip').addEventListener('click', () => switchView('timeline'));

  // timeline filters
  $$('#tl-filters select').forEach(sel => sel.addEventListener('change', () => {
    tlFilter[sel.dataset.f] = sel.value;
    renderTimeline();
  }));

  // time machine
  $('#tm-slider').addEventListener('input', e => onTimeMachine(e.target.value));

  // import
  $('#file-import').addEventListener('change', e => {
    if (e.target.files && e.target.files[0]) importJSONFile(e.target.files[0]);
    e.target.value = '';
  });

  // keyboard
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)){
      e.preventDefault(); $('#search-input').focus();
    }
    if (e.key === 'Escape'){
      const ovs = $$('#modal-root .modal-overlay');
      if (ovs.length) closeModal(ovs[ovs.length-1]);
    }
  });

  window.addEventListener('resize', () => {
    onResize();
    if (MAP.active){ mapResize(); drawMap(); }
  });
}
function switchView(name){
  state.view = name;
  $$('#tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  if (name === 'globe'){
    if (world){ onResize(); if (world.resumeAnimation) world.resumeAnimation(); }
  } else {
    if (world && world.pauseAnimation) world.pauseAnimation();
  }
  if (name === 'map'){
    MAP.active = true;
    mapResize();
    if (!MAP.raf) mapLoop();
  } else {
    MAP.active = false;
    cancelAnimationFrame(MAP.raf); MAP.raf = 0;
    $('#map-tip').classList.add('hidden');
  }
  if (name === 'timeline') renderTimeline();
  if (name === 'trips') renderTrips();
  if (name === 'stats'){ renderStats(); animateStatCells(); }
}

/* ============================================================
   REBUILD + INIT
============================================================ */
function rebuildLayers(){
  buildCityIndex();
  updateGlobeLayers();
  updateDashboard();
}
function rebuildAll(){
  rebuildLayers();
  initTimeMachine();
  renderTimeline();
  renderTrips();
  if (state.view === 'stats') renderStats();
  if (MAP.active) drawMap();
}

function bootDone(){
  const b = $('#boot');
  if (b && !b.classList.contains('done')) b.classList.add('done');
}
// 旧记录里的英文地名/航司按词典规范成中文（仅命中时改写）
function migratePlaceNames(){
  let zhFixed = 0;
  try{
    state.journeys.forEach(j => {
      [j.from, j.to].forEach(p => {
        if (!p) return;
        const c = zhCity(p.city);
        if (c !== p.city){ p.city = c; zhFixed++; }
        const co = zhCountry(p.country);
        if (co !== p.country) p.country = co;
        if (p.code && AIRPORT_ZH[p.code]) p.name = AIRPORT_ZH[p.code];
      });
      if (j.operator){ const o = zhAirline(j.operator); if (o !== j.operator) j.operator = o; }
    });
  }catch(e){ console.warn('name migration skipped', e); }
  // 按手动修正表校准历史航线（adsbdb 存在航季错配 / 方向反转的错误数据）
  let routeFixed = 0;
  try{
    state.journeys.forEach(j => {
      if (j.type !== 'flight') return;
      const before = j.from.code + '>' + j.to.code;
      applyRouteOverride(j);
      if ((j.from.code + '>' + j.to.code) !== before) routeFixed++;
    });
  }catch(e){ console.warn('route migration skipped', e); }
  if (zhFixed || routeFixed) persist();
}
function init(){
  console.info('ATLAS · build 20260915-r2 · Personal Travel Atlas');
  // 兜底最先注册：无论初始化是否出错，8 秒内必定退出启动屏
  const bootGuard = setTimeout(() => {
    if (!globeReady) showLibError();
    bootDone();
  }, 9000);

  try{
    // graceful degradation if a CDN failed
    if (typeof Chart === 'undefined') console.warn('Chart.js failed to load — statistics charts disabled');

    // datalists for place-code & journey-number autocomplete
    const dl1 = document.createElement('datalist'); dl1.id = 'placelist';
    dl1.innerHTML = Object.entries(PLACES).map(([k, p]) =>
      '<option value="' + k + '">' + esc(p.name + ' · ' + p.city) + '</option>').join('');
    const dl2 = document.createElement('datalist'); dl2.id = 'numlist';
    dl2.innerHTML = [...new Set([].concat(Object.keys(FLIGHT_DB), Object.keys(TRAIN_DB),
      state.journeys.map(j => j.number)).filter(Boolean))]
      .map(n => '<option value="' + esc(n) + '">').join('');
    document.body.appendChild(dl1);
    document.body.appendChild(dl2);

    initHeader();
    initSearch();
    initMap();
    state.journeys = store.load(LS.journeys, []);
    state.trips = store.load(LS.trips, []);
    migratePlaceNames();
    importUserTrains();
    initGlobe();
    applySettings();
    initTimeMachine();
    rebuildAll();

    if (!globeReady){
      // give CDN scripts a second chance to arrive, then show fallback
      setTimeout(() => { if (!globeReady) showLibError(); }, 6000);
    }
  }catch(err){
    // 显示真实错误而不是永久黑屏
    console.error('ATLAS init failed:', err);
    try{
      const b = document.querySelector('#boot .boot-msg') || document.querySelector('#boot');
      if (b){
        b.innerHTML = '<div class="boot-msg"><b>初始化出错</b><br>' + esc(String(err && err.message || err)) +
          '<br><br><button class="btn" onclick="location.reload()">重新加载</button></div>';
      }
    }catch(e2){}
  }
  setTimeout(bootDone, 2500); // never hold the boot screen hostage

  // Debug / power-user handle (also handy in the console).
  window.ATLAS = { state, resolvers: { resolveFlight, resolveTrain }, get world(){ return world; } };
}
