<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050608">
<title>ATLAS — 个人旅行图志</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛫</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================= */
/* GLOBAL                        */
/* ============================= */
:root{
  --bg:#050608; --bg2:#0a0c12;
  --panel:rgba(20,20,26,.62); --panel2:rgba(15,16,22,.86);
  --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.16);
  --text:#f2f4fa; --muted:#a4acbf; --faint:#858da2;
  --accent:#6d8bff; --accent2:#9a7bff; --accent-soft:rgba(109,139,255,.13);
  --train:#ffc966; --train2:#ffe0a3; --train-soft:rgba(255,201,102,.12);
  --danger:#ff5d6e; --ok:#4cd693;
  --radius:16px;
  --shadow:0 18px 50px rgba(0,0,0,.5);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Arial,sans-serif;
  color-scheme:dark;
}
body.light{
  --bg:#eef0f5; --bg2:#e4e7ef;
  --panel:rgba(255,255,255,.78); --panel2:rgba(255,255,255,.94);
  --border:rgba(15,20,40,.1); --border2:rgba(15,20,40,.2);
  --text:#171a22; --muted:#5a6072; --faint:#9aa0b0;
  --accent:#3b5bdb; --accent-soft:rgba(59,91,219,.1);
  --train:#b97f16; --train-soft:rgba(185,127,22,.12);
  --shadow:0 18px 50px rgba(30,40,80,.14);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--text);
  overflow:hidden; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
::selection{background:rgba(109,139,255,.35)}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;color:inherit}
a{color:var(--accent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;border:2px solid transparent;background-clip:content-box}
body.light ::-webkit-scrollbar-thumb{background:rgba(20,30,60,.2);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}

/* ============================= */
/* SHARED COMPONENTS             */
/* ============================= */
.glass{
  background:var(--panel);
  backdrop-filter:blur(18px) saturate(1.25);
  -webkit-backdrop-filter:blur(18px) saturate(1.25);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:11px;font-size:13px;font-weight:600;
  border:1px solid var(--border);background:rgba(255,255,255,.04);
  color:var(--text);transition:all .18s ease;white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.09);border-color:var(--border2);transform:translateY(-1px)}
body.light .btn{background:rgba(15,20,40,.04)}
body.light .btn:hover{background:rgba(15,20,40,.08)}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-color:transparent;color:#fff;
  box-shadow:0 6px 22px rgba(109,139,255,.28);
}
.btn.primary:hover{filter:brightness(1.12);box-shadow:0 8px 28px rgba(109,139,255,.4)}
.btn.danger{color:var(--danger);border-color:rgba(255,93,110,.3);background:rgba(255,93,110,.07)}
.btn.danger:hover{background:rgba(255,93,110,.14)}
.btn.small{padding:6px 11px;font-size:12px;border-radius:9px}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:10px;border:1px solid transparent;
  color:var(--muted);transition:all .16s ease;flex:none;
}
.icon-btn:hover{color:var(--text);background:rgba(255,255,255,.07);border-color:var(--border)}
body.light .icon-btn:hover{background:rgba(15,20,40,.06)}
.icon-btn svg{width:18px;height:18px}
.btn svg{width:14px;height:14px;flex:none}
#replay-hud .rh-seg svg{width:15px;height:15px;vertical-align:-2px}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:3px 9px;border-radius:99px;
}
.badge svg{width:11px;height:11px}
.badge.flight{color:#aebdff;background:var(--accent-soft);border:1px solid rgba(109,139,255,.28)}
.badge.train{color:#ffd79a;background:var(--train-soft);border:1px solid rgba(255,201,102,.28)}
.muted{color:var(--muted)}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

/* ============================= */
/* BOOT SCREEN                   */
/* ============================= */
#boot{
  position:fixed;inset:0;z-index:200;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  transition:opacity .7s ease;
}
#boot.done{opacity:0;pointer-events:none}
.boot-mark{
  font-size:34px;font-weight:800;letter-spacing:.42em;text-indent:.42em;
  background:linear-gradient(120deg,#fff,#8fa4ff 60%,#b39aff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:bootIn 1.1s cubic-bezier(.2,.8,.2,1) both;
}
.boot-sub{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);animation:bootIn 1.1s .12s cubic-bezier(.2,.8,.2,1) both}
.boot-bar{width:180px;height:2px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:16px;animation:bootIn .8s .2s both}
.boot-bar i{display:block;height:100%;width:40%;border-radius:2px;background:linear-gradient(90deg,transparent,#6d8bff,transparent);animation:bootSlide 1.2s linear infinite}
@keyframes bootSlide{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes bootIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#boot .boot-msg{max-width:420px;text-align:center;padding:0 24px;color:var(--muted);font-size:14px;line-height:1.6}
#boot .boot-msg b{color:var(--text)}
#boot .boot-actions{display:flex;gap:10px;margin-top:6px}

/* ============================= */
/* PASSWORD GATE                 */
/* ============================= */
#pw-gate{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;align-items:center;justify-content:center}
#pw-gate.hidden{display:none}
.pw-box{
  padding:42px 46px;text-align:center;display:flex;flex-direction:column;gap:12px;min-width:320px;
}
.pw-box input{
  padding:12px 14px;border-radius:10px;font-size:14px;text-align:center;letter-spacing:.12em;
  background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
}
body.light .pw-box input{background:rgba(15,20,40,.035)}
.pw-box input:focus{outline:none;border-color:rgba(109,139,255,.55);box-shadow:0 0 0 3px rgba(109,139,255,.12)}
.pw-box .btn{justify-content:center}
.pw-box.shake{animation:pwShake .35s}
.pw-err{color:var(--danger);font-size:12px}
@keyframes pwShake{0%,100%{transform:none}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

/* ============================= */
/* LAYOUT / HEADER               */
/* ============================= */
main{position:fixed;inset:0}
.view{position:absolute;inset:0;display:none;opacity:0}
.view.active{display:block;opacity:1;animation:viewIn .4s ease both}
.view.scroll{overflow-y:auto;overflow-x:hidden;padding:86px 24px 60px}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:80;
  display:flex;align-items:center;gap:18px;
  padding:12px 20px;
  background:linear-gradient(180deg,rgba(5,6,8,.88) 30%,rgba(5,6,8,.45) 75%,transparent);
  pointer-events:none;
}
body.light #topbar{background:linear-gradient(180deg,rgba(238,240,245,.92) 30%,rgba(238,240,245,.5) 75%,transparent)}
#topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.brand-glyph{
  width:34px;height:34px;border-radius:11px;flex:none;
  background:linear-gradient(135deg,rgba(109,139,255,.22),rgba(154,123,255,.14));
  border:1px solid rgba(109,139,255,.35);
  display:flex;align-items:center;justify-content:center;color:#aebdff;
}
body.light .brand-glyph{color:var(--accent)}
.brand-glyph svg{width:18px;height:18px}
.brand-name{font-size:15px;font-weight:800;letter-spacing:.3em;line-height:1.1}
.brand-sub{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:2px}
#tabs{display:flex;gap:2px;margin-left:8px;padding:4px;border-radius:13px;background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tab{
  display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;
  font-size:12.5px;font-weight:600;color:var(--muted);transition:all .18s ease;white-space:nowrap;
}
.tab svg{width:15px;height:15px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--border)}
body.light .tab.active{background:rgba(15,20,40,.07)}
.tab .tab-dot{width:4px;height:4px;border-radius:99px;background:var(--accent);opacity:0;margin-left:2px}
.tab.active .tab-dot{opacity:1}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.search-wrap{position:relative}
#search-input{
  width:210px;padding:9px 14px 9px 36px;border-radius:11px;font-size:13px;
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:all .2s ease;
}
#search-input::placeholder{color:var(--faint)}
#search-input:focus{width:260px;border-color:rgba(109,139,255,.5);outline:none;box-shadow:0 0 0 3px rgba(109,139,255,.12)}
.search-wrap>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint);pointer-events:none}
#search-results{
  position:absolute;top:calc(100% + 8px);right:0;width:340px;max-height:420px;overflow-y:auto;
  padding:8px;display:none;z-index:90;
}
#search-results.open{display:block;animation:viewIn .18s ease both}
.sr-group{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);padding:10px 10px 5px;font-weight:700}
.sr-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;
  cursor:pointer;transition:background .14s ease;text-align:left;width:100%;
}
.sr-item:hover{background:rgba(255,255,255,.06)}
body.light .sr-item:hover{background:rgba(15,20,40,.05)}
.sr-item .sr-ic{width:28px;height:28px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center}
.sr-item .sr-ic svg{width:14px;height:14px}
.sr-item .sr-ic.flight{background:var(--accent-soft);color:#aebdff}
.sr-item .sr-ic.train{background:var(--train-soft);color:#ffd79a}
.sr-item .sr-ic.place{background:rgba(255,255,255,.06);color:var(--muted)}
.sr-item b{font-size:13px;font-weight:600}
.sr-item span{font-size:11.5px;color:var(--muted);display:block;margin-top:1px}
.sr-empty{padding:16px;text-align:center;color:var(--faint);font-size:12.5px}
#btn-add{padding:9px 15px}
#btn-settings svg{width:17px;height:17px}

/* ============================= */
/* GLOBE VIEW                    */
/* ============================= */
#globe-container{position:absolute;inset:0;overflow:hidden;cursor:grab}
#globe-container:active{cursor:grabbing}
#globe-container canvas{display:block}
.globe-hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.globe-hud>*{pointer-events:auto}
#legend{
  position:absolute;top:72px;right:20px;padding:12px 16px;
  display:flex;flex-direction:column;gap:8px;
}
.lg-row{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--muted);font-weight:500}
.lg-dot{width:16px;height:3px;border-radius:2px;flex:none}
.lg-dot.f{background:linear-gradient(90deg,#5f86ff,#9a6bff);box-shadow:0 0 8px rgba(110,140,255,.7)}
.lg-dot.t{background:linear-gradient(90deg,#ffca6e,#f0a94f);box-shadow:0 0 8px rgba(255,201,102,.6)}
.lg-dot.c{width:7px;height:7px;border-radius:99px;background:#9fb1ff;box-shadow:0 0 8px rgba(159,177,255,.8)}
#zoomctl{
  position:absolute;top:182px;right:20px;z-index:6;
  display:flex;flex-direction:column;gap:4px;padding:6px;
}
#zoomctl button{
  width:32px;height:32px;border-radius:9px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:all .15s ease;
}
#zoomctl button:hover{color:var(--text);background:rgba(255,255,255,.08)}
body.light #zoomctl button:hover{background:rgba(15,20,40,.06)}
#zoomctl svg{width:15px;height:15px}
.relative{position:relative}
.station-drop{
  position:absolute;top:100%;left:0;right:0;z-index:30;
  background:var(--panel2);border:1px solid var(--border2);border-radius:10px;
  overflow:hidden;max-height:216px;overflow-y:auto;box-shadow:var(--shadow);
}
.station-drop button{display:block;width:100%;text-align:left;padding:7px 11px;font-size:12.5px;color:var(--text)}
.station-drop button:hover{background:var(--accent-soft)}
.station-drop button small{display:block;color:var(--muted);font-size:10.5px;margin-top:1px}
.city-label{
  display:inline-block;transform:translate(-50%,-170%);
  font-size:10.5px;font-weight:600;letter-spacing:.04em;white-space:nowrap;
  color:#fff;padding:1px 3px;cursor:pointer;user-select:none;pointer-events:auto;
  text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 2px rgba(0,0,0,.9);
  transition:text-shadow .15s ease,color .15s ease;
}
.city-label:hover{color:#fff;text-shadow:0 0 10px rgba(140,165,255,1),0 1px 4px rgba(0,0,0,.9)}
#dash-cards{
  position:absolute;left:20px;bottom:104px;
  display:flex;padding:14px 8px;max-width:calc(100vw - 40px);
  overflow-x:auto;scrollbar-width:none;
}
#dash-cards::-webkit-scrollbar{display:none}
.dash-item{padding:2px 20px;border-left:1px solid var(--border);flex:none}
.dash-item:first-child{border-left:none}
.dash-val{font-size:21px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.dash-val small{font-size:12px;font-weight:600;color:var(--muted)}
.dash-lab{font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-top:3px;white-space:nowrap}
#empty-state{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  padding:38px 46px;text-align:center;max-width:90vw;
}
#empty-state .es-glyph{color:var(--accent);opacity:.85;margin-bottom:14px}
#empty-state .es-glyph svg{width:44px;height:44px}
#empty-state h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
#empty-state p{color:var(--muted);font-size:13.5px;margin:8px 0 20px}
#globe-error{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  padding:30px 36px;text-align:center;max-width:min(460px,90vw);z-index:20;
}
#globe-error h3{font-size:16px;margin-bottom:10px}
#globe-error p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:18px}

/* ============================= */
/* TIME MACHINE                  */
/* ============================= */
#timebar{
  position:absolute;left:50%;bottom:20px;transform:translateX(-50%);
  width:min(560px,92vw);padding:13px 20px 11px;z-index:6;
}
.tm-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.tm-head span{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
#tm-year{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(109,139,255,.55),rgba(154,123,255,.35))}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:99px;margin-top:-6px;
  background:#fff;border:3px solid var(--accent);
  box-shadow:0 0 0 4px rgba(109,139,255,.18),0 2px 10px rgba(0,0,0,.5);
  transition:transform .15s ease;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:rgba(109,139,255,.45)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:99px;background:#fff;border:3px solid var(--accent)}
.tm-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;margin-top:2px}

/* ============================= */
/* REPLAY                        */
/* ============================= */
#btn-replay{
  position:absolute;right:20px;bottom:104px;z-index:6;
  display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:13px;
  font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--text);
  transition:all .2s ease;
}
#btn-replay svg{width:15px;height:15px;color:var(--accent)}
#btn-replay:hover{border-color:rgba(109,139,255,.45);box-shadow:0 8px 30px rgba(109,139,255,.22);transform:translateY(-2px)}
#replay-hud{
  position:absolute;top:72px;left:50%;transform:translateX(-50%);z-index:8;
  padding:12px 22px;text-align:center;min-width:280px;max-width:92vw;
}
#replay-hud .rh-title{font-size:9.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
#replay-hud .rh-seg{font-size:15px;font-weight:700}
#replay-hud .rh-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
#replay-hud .rh-bar{height:2px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:10px;overflow:hidden}
#replay-hud .rh-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px}
#replay-dock{
  position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  width:min(640px,94vw);
}
#replay-dock .icon-btn{color:var(--muted)}
#rp-play{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff!important;border-radius:10px;width:38px;height:38px}
#rp-play:hover{filter:brightness(1.15)}
.rp-speed{
  font-size:12px;font-weight:700;padding:7px 11px;border-radius:9px;flex:none;
  border:1px solid var(--border);color:var(--muted);transition:all .15s;font-variant-numeric:tabular-nums;
}
.rp-speed:hover{color:var(--text);border-color:var(--border2)}
#rp-slider{flex:1;min-width:60px}
.rp-count{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none;min-width:52px;text-align:right}
body.replaying #timebar,body.replaying #btn-replay,body.replaying #dash-cards,body.replaying #legend{display:none}
/* 回放期间去掉毛玻璃：模糊层压在动态画布上每帧重算，是掉帧大户 */
body.replaying #replay-dock,body.replaying #replay-hud{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--panel2)}

/* ============================= */
/* 2D MAP VIEW                   */
/* ============================= */
#view-map{background:var(--bg)}
#map-canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
#map-canvas:active{cursor:grabbing}
.map-hint{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);padding:8px 16px;font-size:11px;color:var(--muted);border-radius:99px;pointer-events:none}
#map-tip{position:absolute;padding:7px 12px;font-size:12px;border-radius:10px;pointer-events:none;z-index:10;transform:translate(-50%,-130%);white-space:nowrap}
#map-tip b{font-size:12.5px}
#map-tip span{color:var(--muted);font-size:11px;margin-left:6px}

/* ============================= */
/* TIMELINE                      */
/* ============================= */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.page-head .ph-sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.filters{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:10px 12px;margin-bottom:24px;border-radius:14px;
}
.filters select{
  padding:7px 10px;border-radius:9px;font-size:12px;font-weight:500;
  background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--text);
  max-width:150px;cursor:pointer;transition:border-color .15s;
}
body.light .filters select{background:rgba(15,20,40,.04)}
.filters select:hover{border-color:var(--border2)}
.filters select:focus{outline:none;border-color:rgba(109,139,255,.5)}
#tl-count{font-size:11.5px;color:var(--faint);margin-left:auto;white-space:nowrap}
.tl-group{margin-bottom:6px}
.tl-date{
  font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--faint);
  padding:20px 4px 8px;text-transform:uppercase;
}
.tl-card{
  display:grid;grid-template-columns:92px 1fr auto;gap:6px 18px;align-items:center;
  padding:15px 18px;margin-bottom:10px;cursor:pointer;
  border-left:2px solid transparent;
  transition:transform .18s ease,border-color .18s,box-shadow .18s,background .18s;
}
.tl-card:hover{transform:translateX(4px);background:var(--panel2);box-shadow:0 10px 34px rgba(0,0,0,.35)}
.tl-card.flight{border-left-color:rgba(109,139,255,.55)}
.tl-card.train{border-left-color:rgba(255,201,102,.55)}
.tl-when{display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.tl-time{font-size:15px;font-weight:700}
.tl-time{cursor:pointer}
.tl-time:hover{color:var(--accent)}
.tl-sub{font-size:11.5px;color:var(--muted)}
.tl-mid{min-width:0}
.tl-num{font-size:15px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tl-op{font-size:12px;color:var(--muted);margin-top:3px}
.tl-route{font-size:12px;color:var(--faint);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-end{font-variant-numeric:tabular-nums}
.tl-end .tl-time{text-align:right}
.tl-end .tl-sub{text-align:right}
.tl-meta{font-size:11.5px;color:var(--faint);text-align:right;white-space:nowrap;margin-top:6px}
.tl-empty{text-align:center;padding:60px 20px;color:var(--faint);font-size:14px}

/* ============================= */
/* TRIPS                         */
/* ============================= */
#trips-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.trip-card{padding:20px;display:flex;flex-direction:column;gap:12px;transition:transform .2s ease,box-shadow .2s}
.trip-card:hover{transform:translateY(-3px);box-shadow:0 16px 44px rgba(0,0,0,.4)}
.trip-name{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.trip-range{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.trip-stats{display:flex;gap:6px;flex-wrap:wrap}
.trip-chip{font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted)}
.trip-segs{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.trip-seg{display:flex;align-items:center;gap:8px}
.trip-seg svg{width:12px;height:12px;flex:none}
.trip-seg.flight svg{color:#aebdff}.trip-seg.train svg{color:#ffd79a}
.trip-seg b{color:var(--text);font-weight:600}
.trip-actions{display:flex;gap:8px;margin-top:auto;padding-top:8px}
.trip-new{
  border:1px dashed var(--border2);border-radius:var(--radius);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  min-height:180px;color:var(--muted);cursor:pointer;transition:all .2s;
  background:transparent;
}
.trip-new:hover{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}

/* ============================= */
/* STATISTICS                    */
/* ============================= */
.year-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}
.stat-chip{
  padding:7px 15px;border-radius:99px;font-size:12.5px;font-weight:600;
  border:1px solid var(--border);color:var(--muted);transition:all .16s;
}
.stat-chip:hover{color:var(--text);border-color:var(--border2)}
.stat-chip.active{background:linear-gradient(135deg,rgba(109,139,255,.2),rgba(154,123,255,.14));border-color:rgba(109,139,255,.5);color:var(--text)}
.stats-section{margin-bottom:30px}
.stats-section h3{
  font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--faint);margin-bottom:13px;
}
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sum-cell{padding:17px 18px}
.sum-val{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.sum-val small{font-size:12px;color:var(--muted);font-weight:600}
.sum-lab{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.rec-card{padding:18px 20px}
.rec-lab{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
.rec-route{font-size:17px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rec-route svg{width:15px;height:15px}
.rec-card.flight .rec-route svg{color:#aebdff}
.rec-card.train .rec-route svg{color:#ffd79a}
.rec-val{font-size:13px;font-weight:600;color:var(--accent);margin-top:5px;font-variant-numeric:tabular-nums}
.rec-card.train .rec-val{color:var(--train)}
.rec-sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.charts-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:10px}
.chart-card{padding:18px}
.chart-box{position:relative;height:250px}
.donut-toggle{display:flex;gap:5px;margin-bottom:10px}
.donut-toggle button{font-size:11px;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--border);color:var(--muted);transition:all .15s}
.donut-toggle button.active{border-color:rgba(109,139,255,.5);color:var(--text);background:var(--accent-soft)}
.rank-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.rank-card{padding:16px 18px}
.rank-row{display:grid;grid-template-columns:1fr 44px;gap:10px;align-items:center;padding:6px 0}
.rank-name{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:4px}
.rank-n{font-size:12px;font-weight:700;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.rank-track{grid-column:1/-1;height:3px;border-radius:3px;background:rgba(255,255,255,.05);overflow:hidden;margin-top:-4px}
.rank-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.rank-card.train .rank-fill{background:linear-gradient(90deg,#ffca6e,#e89b3c)}
.rank-empty{font-size:12px;color:var(--faint);padding:8px 0}

/* ============================= */
/* MODALS                        */
/* ============================= */
#modal-root{position:fixed;inset:0;z-index:120;pointer-events:none}
.modal-overlay{
  position:fixed;inset:0;background:rgba(3,4,7,.62);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;transition:opacity .22s ease;pointer-events:auto;overflow-y:auto;
}
.modal-overlay.show{opacity:1}
.modal{
  background:var(--panel2);border:1px solid var(--border2);border-radius:20px;
  box-shadow:0 30px 90px rgba(0,0,0,.6);
  width:100%;max-width:520px;margin:auto;
  transform:translateY(16px) scale(.98);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  max-height:calc(100vh - 40px);display:flex;flex-direction:column;
}
.modal-overlay.show .modal{transform:none}
.modal.mid{max-width:600px}
.modal.wide{max-width:780px}
.modal-head{display:flex;align-items:center;gap:12px;padding:20px 24px 0;flex:none}
.modal-title{font-size:17px;font-weight:700;letter-spacing:-.01em;flex:1}
.modal-kicker{font-size:9.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.modal-close{margin-left:auto}
.modal-body{padding:18px 24px 24px;overflow-y:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px 22px;border-top:1px solid var(--border);flex:none;flex-wrap:wrap}
.form-section{margin-bottom:20px}
.form-section h4{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:11px}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.field label{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:8px 11px;border-radius:9px;font-size:13px;
  background:rgba(255,255,255,.045);border:1px solid var(--border);color:var(--text);
  transition:border-color .15s, box-shadow .15s;
}
body.light .field input,body.light .field select,body.light .field textarea{background:rgba(15,20,40,.035)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:rgba(109,139,255,.55);box-shadow:0 0 0 3px rgba(109,139,255,.12)}
.field textarea{resize:vertical;min-height:64px;font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
.field input[type=date]{color-scheme:dark}
body.light .field input[type=date]{color-scheme:light}
.field .err{border-color:rgba(255,93,110,.6)!important}
.span2{grid-column:span 2}.span1{grid-column:span 1}
.type-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.type-card{
  padding:30px 20px;border-radius:16px;border:1px solid var(--border);text-align:center;
  cursor:pointer;transition:all .2s ease;background:rgba(255,255,255,.03);
}
.type-card:hover{transform:translateY(-3px);border-color:var(--accent);background:var(--accent-soft);box-shadow:0 12px 36px rgba(109,139,255,.15)}
.type-card svg{width:30px;height:30px;margin-bottom:12px}
.type-card.f svg{color:#aebdff}
.type-card.t svg{color:#ffd79a}
.type-card b{display:block;font-size:15px;font-weight:700}
.type-card span{font-size:11.5px;color:var(--muted);display:block;margin-top:5px}
.quick-lookup{
  display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;
  padding:14px;border-radius:14px;border:1px solid var(--border);margin-bottom:20px;
  background:linear-gradient(135deg,rgba(109,139,255,.06),rgba(154,123,255,.04));
}
.quick-lookup .field{flex:1;min-width:130px}
.seg-toggle{display:inline-flex;padding:4px;gap:3px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--border)}
.seg-toggle button{padding:7px 16px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted);transition:all .15s;display:flex;align-items:center;gap:7px}
.seg-toggle button svg{width:14px;height:14px}
.seg-toggle button.active{background:rgba(255,255,255,.09);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
body.light .seg-toggle button.active{background:#fff}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:13px;overflow:hidden;margin:16px 0}
.kv{background:var(--panel2);padding:11px 15px}
.kv .k{font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.kv .v{font-size:13.5px;font-weight:600}
.jd-route{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:14px;background:linear-gradient(135deg,rgba(109,139,255,.09),rgba(154,123,255,.05));border:1px solid var(--border)}
.jd-end{flex:1;min-width:0}
.jd-code{font-size:24px;font-weight:800;letter-spacing:.02em}
.jd-name{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jd-arrow{flex:none;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.jd-arrow svg{width:20px;height:20px}
.jd-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.jd-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.jd-list .sr-item{border:1px solid transparent}
.seg-line{display:flex;align-items:center;gap:14px;position:relative;padding:10px 4px 22px}
.seg-line:not(:last-child)::before{
  content:"";position:absolute;left:15px;top:34px;bottom:2px;width:1.5px;
  background:linear-gradient(180deg,var(--border2),var(--border));
}
.seg-dot{
  width:31px;height:31px;border-radius:99px;flex:none;z-index:1;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border2);background:var(--panel2);
}
.seg-dot svg{width:14px;height:14px}
.seg-dot.flight{color:#aebdff;border-color:rgba(109,139,255,.4)}
.seg-dot.train{color:#ffd79a;border-color:rgba(255,201,102,.4)}
.seg-info{flex:1;min-width:0;cursor:pointer}
.seg-info b{font-size:13.5px}
.seg-info span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.seg-x{color:var(--faint)}
.seg-x:hover{color:var(--danger)}
.switch{position:relative;width:38px;height:22px;flex:none;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch i{
  position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.1);
  border:1px solid var(--border);transition:all .2s;
}
.switch i::after{
  content:"";position:absolute;left:3px;top:2.5px;width:15px;height:15px;border-radius:99px;
  background:#8b91a3;transition:all .2s cubic-bezier(.2,.8,.2,1);
}
.switch input:checked+i{background:rgba(109,139,255,.35);border-color:rgba(109,139,255,.5)}
.switch input:checked+i::after{transform:translateX(16px);background:#fff}
.set-row{display:flex;align-items:center;gap:14px;padding:11px 2px;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-row .st{flex:1}
.set-row b{font-size:13.5px;font-weight:600;display:block}
.set-row span{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
.set-row input[type=range]{width:130px}
.data-btns{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.settings-note{font-size:11px;color:var(--faint);line-height:1.7;margin-top:14px}

/* ============================= */
/* TOASTS                        */
/* ============================= */
#toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  padding:11px 18px;border-radius:12px;font-size:13px;font-weight:500;
  background:var(--panel2);border:1px solid var(--border2);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px;max-width:90vw;
  animation:toastIn .3s cubic-bezier(.2,.8,.2,1) both;
}
.toast.out{animation:toastOut .3s ease both}
.toast i{width:7px;height:7px;border-radius:99px;flex:none;background:var(--accent)}
.toast.error i{background:var(--danger)}
.toast.success i{background:var(--ok)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.96)}}

/* ============================= */
/* RESPONSIVE                    */
/* ============================= */
@media (max-width:1060px){
  .form-grid{grid-template-columns:repeat(2,1fr)}
  .span2{grid-column:span 2}
  .charts-grid{grid-template-columns:1fr}
}
@media (max-width:960px){
  #topbar{flex-wrap:wrap;gap:10px;padding:10px 14px}
  #tabs{order:3;width:100%;margin-left:0;overflow-x:auto;scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  .brand-sub{display:none}
  #search-input{width:150px}
  #search-input:focus{width:190px}
  .view.scroll{padding:150px 14px 40px}
  #legend{display:none}
  #zoomctl{top:72px;right:12px}
  #dash-cards{left:12px;right:12px;bottom:126px;max-width:calc(100vw - 24px);padding-right:104px}
  .dash-item{padding:2px 14px}
  #btn-replay{right:14px;bottom:126px;padding:10px 14px}
  #timebar{bottom:14px}
  .tl-card{grid-template-columns:64px 1fr;grid-auto-rows:auto}
  .tl-end{grid-column:2;display:flex;justify-content:space-between;align-items:baseline}
  .tl-end .tl-time,.tl-end .tl-sub{text-align:left}
  .tl-meta{text-align:left;margin-top:2px}
}
@media (max-width:640px){
  .tab span{display:none}
  .tab{padding:8px 11px}
  .tab .tab-dot{display:none}
  #btn-add .btn-label{display:none}
  #btn-add{padding:9px 12px}
  #search-input{width:120px;padding-left:32px}
  #search-input:focus{width:150px}
  #search-results{width:calc(100vw - 28px);right:-6px}
  #dash-cards{bottom:118px}
  .dash-val{font-size:17px}
  #replay-dock{gap:5px;padding:8px 10px}
  .rp-count{display:none}
  .modal{max-width:100%!important}
  .modal-overlay{padding:10px}
  .form-grid{grid-template-columns:1fr 1fr}
  .type-cards{grid-template-columns:1fr}
  .kv-grid{grid-template-columns:1fr}
  .jd-code{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<noscript><div style="padding:40px;text-align:center;font-family:sans-serif;color:#e9ecf4">ATLAS 需要启用 JavaScript 才能渲染你的旅行图志。</div></noscript>

<div id="boot">
  <div class="boot-mark">ATLAS</div>
  <div class="boot-sub">个人旅行图志</div>
  <div class="boot-bar"><i></i></div>
</div>

<div id="pw-gate" class="hidden">
  <div class="pw-box glass">
    <div class="boot-mark" style="font-size:24px">ATLAS</div>
    <div class="boot-sub" style="margin:4px 0 14px">个人旅行图志</div>
    <input id="pw-input" type="password" placeholder="输入访问密码">
    <button id="pw-go" class="btn primary">解 锁</button>
    <div id="pw-err" class="pw-err hidden">密码错误，请重试</div>
  </div>
</div>

<header id="topbar">
  <div class="brand">
    <div class="brand-glyph" id="brand-glyph"></div>
    <div>
      <div class="brand-name">ATLAS</div>
      <div class="brand-sub">个人旅行图志</div>
    </div>
  </div>
  <nav id="tabs"></nav>
  <div class="top-actions">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search-input" type="text" placeholder="搜索航班号、车次、城市…" autocomplete="off" spellcheck="false">
      <div id="search-results" class="glass"></div>
    </div>
    <button id="btn-add" class="btn primary"><span class="btn-label">添加行程</span><span class="btn-plus">＋</span></button>
    <button id="btn-settings" class="icon-btn" title="设置"></button>
  </div>
</header>

<main>
  <!-- ============================= -->
  <!-- GLOBE VIEW                    -->
  <!-- ============================= -->
  <section id="view-globe" class="view active">
    <div id="globe-container"></div>
    <div class="globe-hud">
      <div id="legend" class="glass">
        <div class="lg-row"><span class="lg-dot f"></span>航班航线</div>
        <div class="lg-row"><span class="lg-dot t"></span>铁路线路</div>
        <div class="lg-row"><span class="lg-dot c"></span>到访城市</div>
      </div>
      <div id="zoomctl" class="glass">
        <button id="zoom-in" title="放大"></button>
        <button id="zoom-out" title="缩小"></button>
        <button id="zoom-reset" title="复位视角"></button>
      </div>
      <div id="empty-state" class="glass hidden">
        <div class="es-glyph" id="es-glyph"></div>
        <h2>你的世界正在等你。</h2>
        <p>添加你的第一段行程。</p>
        <button class="btn primary" id="btn-empty-add">＋ 添加行程</button>
      </div>

const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

function fmtInt(n){ return Math.round(n||0).toLocaleString('en-US'); }
function fmtKm(km){ return fmtInt(km) + ' 公里'; }
function fmtHours(min){ return fmtInt((min||0)/60) + ' 小时'; }
function fmtDur(min){
  min = Math.max(0, Math.round(min||0));
  const h = Math.floor(min/60), m = min%60;
  if (h === 0) return m + ' 分钟';
  return h + ' 小时 ' + m + ' 分';
}
function fmtDate(d){ // '2026-09-08' -> '2026年9月8日'
  if (!d) return '—';
  const p = String(d).split('-');
  if (p.length < 3) return d;
  return (+p[0]) + '年' + (+p[1]) + '月' + (+p[2]) + '日';
}
function fmtDateBig(d){ // -> '2026年9月21日'
  return fmtDate(d);
}
function yearOf(j){ return j && j.date ? +String(j.date).slice(0,4) : null; }
function monthOf(j){ return j && j.date ? (+String(j.date).slice(5,7)) - 1 : null; }
function normNum(s){ return String(s||'').toUpperCase().replace(/\s+/g,''); }
function timeToMin(t){
  t = String(t||'').replace('+1','');
  const m = t.match(/^(\d{1,2}):(\d{2})/);
  return m ? (+m[1])*60 + (+m[2]) : null;
}
function durFromTimes(dep, arr){
  const d1 = timeToMin(dep), d2 = timeToMin(arr);
  if (d1 == null || d2 == null) return 0;
  let diff = d2 - d1;
  if (String(arr||'').includes('+1')) diff += 1440;
  if (diff <= 0) diff += 1440;
  return diff;
}
function haversine(a, b){
  if (!isFinite(a&&a.lat) || !isFinite(b&&b.lat)) return 0;
  const R = 6371, toR = Math.PI/180;
  const dLat = (b.lat-a.lat)*toR, dLng = (b.lng-a.lng)*toR;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
// Great-circle interpolation in lat/lng space (handles antimeridian)
function slerpLL(la1, lo1, la2, lo2, t){
  const toR = Math.PI/180, toD = 180/Math.PI;
  const p1 = [la1*toR, lo1*toR], p2 = [la2*toR, lo2*toR];
  const v1 = [Math.cos(p1[0])*Math.cos(p1[1]), Math.cos(p1[0])*Math.sin(p1[1]), Math.sin(p1[0])];
  const v2 = [Math.cos(p2[0])*Math.cos(p2[1]), Math.cos(p2[0])*Math.sin(p2[1]), Math.sin(p2[0])];
  const dot = clamp(v1[0]*v2[0]+v1[1]*v2[1]+v1[2]*v2[2], -1, 1);
  const om = Math.acos(dot);
  if (om < 1e-6) return { lat: la1 + (la2-la1)*t, lng: lo1 + (lo2-lo1)*t };
  const s = Math.sin(om);
  const a = Math.sin((1-t)*om)/s, b = Math.sin(t*om)/s;
  const x = a*v1[0]+b*v2[0], y = a*v1[1]+b*v2[1], z = a*v1[2]+b*v2[2];
  return { lat: Math.atan2(z, Math.sqrt(x*x+y*y))*toD, lng: Math.atan2(y, x)*toD };
}
function slerpPath(from, to, n){
  const pts = [];
  for (let i=0;i<=n;i++){
    const p = slerpLL(from.lat, from.lng, to.lat, to.lng, i/n);
    pts.push(p);
  }
  return pts;
}
function debounce(fn, ms){
  let t; return function(){ clearTimeout(t); const a=arguments, c=this; t=setTimeout(()=>fn.apply(c,a), ms); };
}
function countUp(el, to, fmt){
  if (!el) return;
  const from = el._v || 0;
  el._v = to;
  if (from === to){ el.textContent = fmt ? fmt(to) : fmtInt(to); return; }
  const t0 = performance.now(), dur = 850;
  function step(t){
    const p = clamp((t-t0)/dur, 0, 1), e = 1 - Math.pow(1-p, 3);
    const v = from + (to-from)*e;
    el.textContent = fmt ? fmt(v) : fmtInt(v);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============================================================

const LS = { journeys:'atlas.v1.journeys', trips:'atlas.v1.trips', settings:'atlas.v1.settings', meta:'atlas.v1.meta' };
const store = {
  load(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ console.warn('storage read failed', e); return fallback; }
  },
  save(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch(e){ toast('写入本地存储失败', 'error'); return false; }
  },
  remove(key){ try{ localStorage.removeItem(key); }catch(e){} }
};
function persist(){
  store.save(LS.journeys, state.journeys);
  store.save(LS.trips, state.trips);
}

/* ============================================================
   车站库（可选联网同步，同步一次后离线可用）
   欧洲: trainline-eu/stations (GitHub, 7.2万站按主站过滤)
   中国: Wikidata 查询（中文标签 + 坐标，剔除地铁站）
============================================================ */
const LS_STATIONS = 'atlas.v1.stations';
const STATION_LIB = { data:null, count:0, syncing:false };
const CC_ZH = { FR:'法国',DE:'德国',GB:'英国',CH:'瑞士',IT:'意大利',ES:'西班牙',NL:'荷兰',BE:'比利时',AT:'奥地利',SE:'瑞典',NO:'挪威',DK:'丹麦',FI:'芬兰',PT:'葡萄牙',PL:'波兰',CZ:'捷克',HU:'匈牙利',LU:'卢森堡',IE:'爱尔兰',GR:'希腊',EE:'爱沙尼亚',LV:'拉脱维亚',LT:'立陶宛',HR:'克罗地亚',RS:'塞尔维亚',SI:'斯洛文尼亚',SK:'斯洛伐克',BG:'保加利亚',RO:'罗马尼亚' };

function loadStationLib(){
  if (STATION_LIB.data) return STATION_LIB.data;
  const saved = store.load(LS_STATIONS, null);
  if (saved && saved.cn && saved.eu){
    STATION_LIB.data = saved;
    STATION_LIB.count = saved.cn.length + saved.eu.length;
  }
  return STATION_LIB.data;
}
function searchStations(q, limit){
  const data = loadStationLib();
  if (!data || !q) return [];
  q = q.toLowerCase();
  const hits = [];
  for (const arr of [data.cn, data.eu]){
    for (const s of arr){
      if (s[0].toLowerCase().includes(q)){
        hits.push({ name:s[0], city:s[1], country:s[2], lat:s[3], lng:s[4] });
        if (hits.length >= (limit || 8)) return hits;
      }
    }
  }
  return hits;
}
async function syncStationLib(){
  const out = { v:1, t: Date.now(), cn: [], eu: [] };
  // —— 欧洲（trainline-eu/stations，仅保留主站与可推荐的城市站）——
  const r = await fetch('https://raw.githubusercontent.com/trainline-eu/stations/master/stations.csv');
  const t = await r.text();
  const rows = t.split('\n');
  const head = rows[0].split(';');
  const ix = n => head.indexOf(n);
  const iName = ix('name'), iLat = ix('latitude'), iLng = ix('longitude'), iCC = ix('country'),
        iCity = ix('is_city'), iMain = ix('is_main_station'), iSug = ix('is_suggestable');
  for (let i = 1; i < rows.length; i++){
    const c = rows[i].split(';');
    const lat = parseFloat(c[iLat]), lng = parseFloat(c[iLng]);
    const keep = c[iMain] === 't' || (c[iCity] === 't' && c[iSug] === 't');
    if (!keep || !isFinite(lat) || !isFinite(lng) || !c[iName]) continue;
    out.eu.push([c[iName], CC_ZH[c[iCC]] || c[iCC], Math.round(lat * 10000) / 10000, Math.round(lng * 10000) / 10000]);
  }
  // —— 中国（Wikidata：中文标签 + 坐标，剔除地铁站）——
  try{
    const sparql = `SELECT ?stLabel ?coord WHERE {
      ?st wdt:P31/wdt:P279* wd:Q55488 .
      ?st wdt:P17 wd:Q148 .
      ?st wdt:P625 ?coord .
      MINUS { ?st wdt:P31/wdt:P279* wd:Q928830. }
      SERVICE wikibase:label { bd:serviceParam wikibase:language "zh-hans,zh-cn,zh,en". }
    } LIMIT 8000`;
    const r2 = await fetch('https://query.wikidata.org/sparql?query=' + encodeURIComponent(sparql) + '&format=json',
      { headers: { 'Accept': 'application/sparql-results+json' } });
    const j2 = await r2.json();
    (j2.results && j2.results.bindings || []).forEach(b => {
      if (!b.coord) return;
      const m = b.coord.value.match(/Point\(([-\d.]+) ([-\d.]+)\)/);
      const name = b.stLabel ? b.stLabel.value : '';
      if (!m || !name) return;
      out.cn.push([name, name.replace(/(车站|站)$/, ''), '中国',
        Math.round(parseFloat(m[2]) * 10000) / 10000, Math.round(parseFloat(m[1]) * 10000) / 10000]);
    });
  }catch(e){ /* 中国站源失败时仍保留欧洲部分 */ }
  STATION_LIB.data = out;
  STATION_LIB.count = out.cn.length + out.eu.length;
  store.save(LS_STATIONS, out);
  return STATION_LIB.count;
}
function attachStationAutocomplete(inputEl, side, form){
  if (!inputEl) return;
  const drop = document.createElement('div');
  drop.className = 'station-drop hidden';
  inputEl.parentNode.appendChild(drop);
  inputEl.parentNode.classList.add('relative');
  const set = (n, v) => { const el = form.elements[n]; if (el && v != null) el.value = v; };
  inputEl.addEventListener('input', () => {
    const list = searchStations(inputEl.value.trim(), 8);
    if (!list.length){ drop.classList.add('hidden'); return; }
    drop.innerHTML = list.map((s, i) =>
      '<button type="button" data-i="' + i + '">' + esc(s.name) + '<small>' + esc(s.city) + ' · ' + esc(s.country) + '</small></button>').join('');
    drop.classList.remove('hidden');
    $$('button', drop).forEach(b => b.addEventListener('mousedown', () => {
      const s = list[+b.dataset.i];
      inputEl.value = s.name;
      set(side + 'Name', s.name); set(side + 'City', s.city); set(side + 'Country', s.country);
      set(side + 'Lat', s.lat); set(side + 'Lng', s.lng);
      drop.classList.add('hidden');
    }));
  });
  inputEl.addEventListener('blur', () => setTimeout(() => drop.classList.add('hidden'), 180));
}

/* ============================================================
   AviationStack 时刻源（补全航班起降时间）
   免费档每月 100 次请求；同一航班号只查询一次并永久缓存
============================================================ */
const AVIATIONSTACK_KEY = '93fc68083297c16f656436239fe3cea9';
const LS_ASKY = 'atlas.v1.astimes';

let ASTIMES = null;
function loadAsTimes(){
  if (!ASTIMES) ASTIMES = store.load(LS_ASKY, {});
  return ASTIMES;
}
function isoToHm(iso, tz){
  try{
    return new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso));
  }catch(e){ return ''; }
}
async function avstackLookup(num){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try{
    const r = await fetch('https://api.aviationstack.com/v1/flights?access_key=' + AVIATIONSTACK_KEY + '&flight_iata=' + encodeURIComponent(num) + '&limit=1', { signal: ctrl.signal });
    const d = await r.json().catch(() => null);
    if (d && d.error) return { quota: true, err: d.error.message || '' };
    const f = d && d.data && d.data[0];
    if (!f || !f.departure || !f.arrival) return null;
    return {
      depIata: (f.departure.iata || '').toUpperCase(),
      arrIata: (f.arrival.iata || '').toUpperCase(),
      depHm: isoToHm(f.departure.scheduled, f.departure.timezone || 'UTC'),
      arrHm: isoToHm(f.arrival.scheduled, f.arrival.timezone || 'UTC'),
      date: f.flight_date || ''
    };
  }catch(e){ return null; }
  finally{ clearTimeout(timer); }
}
function applyAvstackCache(j){
  const c = loadAsTimes()[normNum(j.number)];
  if (!c || c.miss || c.quota) return false;
  if (c.depIata && j.from.code && c.depIata !== j.from.code.toUpperCase()) return false;
  let ok = false;
  if (c.depHm && !j.scheduledDeparture){ j.scheduledDeparture = c.depHm; ok = true; }
  if (c.arrHm && !j.scheduledArrival){ j.scheduledArrival = c.arrHm; ok = true; }
  return ok;
}
async function applyAvstackTimes(j){
  const key = normNum(j.number);
  if (!key) return;
  let info = loadAsTimes()[key];
  if (!info || info.miss){
    info = await avstackLookup(key) || { miss: true };
    loadAsTimes()[key] = info;
    store.save(LS_ASKY, loadAsTimes());
  }
  if (!info || info.miss || info.quota) return;
  if (info.depIata && j.from.code && info.depIata !== j.from.code.toUpperCase()) return;
  if (info.depHm && !j.scheduledDeparture) j.scheduledDeparture = info.depHm;
  if (info.arrHm && !j.scheduledArrival) j.scheduledArrival = info.arrHm;
}
// 批量补全时间线：只为缺时刻的航班发请求，同一航班永久缓存
async function fillMissingFlightTimes(progressCb){
  const todo = [], seen = {};
  state.journeys.forEach(j => {
    if (j.type !== 'flight') return;
    if (j.scheduledDeparture && j.scheduledArrival) return;
    const key = normNum(j.number);
    if (!key || seen[key]) return;
    seen[key] = true;
    if (loadAsTimes()[key]) return;
    todo.push({ key, number: j.number });
  });
  let done = 0, applied = 0;
  for (const item of todo){
    done++;
    if (progressCb) progressCb(done, todo.length, item.number);
    const info = await avstackLookup(item.key);
    if (info && info.quota) return { quota: true, applied };
    loadAsTimes()[item.key] = info || { miss: true };
    store.save(LS_ASKY, loadAsTimes());
  }
  state.journeys.forEach(j => {
    if (j.type !== 'flight') return;
    if (j.scheduledDeparture && j.scheduledArrival) return;
    if (applyAvstackCache(j)) applied++;
  });
  if (applied) persist();
  return { applied, done, total: todo.length };
}

// 站代码需已存在于上方 PLACES；留空则不做任何导入。
const USER_TRAINS = [
  // ['G5','2024-05-01','BJN','SHQ',269,'07:00','11:29'],
];
const LS_USERTRAINS = 'atlas.v1.usertrains';
const USER_IMPORT_VERSION = 4;
function importUserTrains(){
  if ((store.load(LS_USERTRAINS, 0) || 0) >= USER_IMPORT_VERSION) return 0;
  let added = 0, updated = 0;
  USER_TRAINS.forEach(t => {
    const [num, date, fk, tk, dur, dep, arr, operator, category] = t;
    const from = place(fk), to = place(tk);
    if (!from || !to) return;
    let j = state.journeys.find(x => x.type === 'train' && normNum(x.number) === normNum(num) &&
      x.date === date && x.from.code === from.code && x.to.code === to.code);
    if (j){
      // 已存在 → 用真实的时刻/时长覆盖旧估算
      if (dep){ if (j.scheduledDeparture !== dep) updated++; j.scheduledDeparture = dep; }
      if (arr){ if (j.scheduledArrival !== arr) updated++; j.scheduledArrival = arr; }
      if (dur && j.durationMinutes !== dur){ updated++; j.durationMinutes = dur; }
      return;
    }
    state.journeys.push(makeJourney({
      type: 'train', number: num, date,
      operator: operator || '中国铁路', operatorCode: '',
      category: category || (num[0] === 'K' ? 'conventional' : 'highspeed'),
      from, to,
      scheduledDeparture: dep || '', scheduledArrival: arr || '',
      durationMinutes: dur || 0,
      distanceKm: Math.round(haversine(from, to) * 1.22)
    }));
    added++;
  });
  if (added || updated) persist();
  store.save(LS_USERTRAINS, USER_IMPORT_VERSION);
  return added;
}

/* ============================================================
   DATA MODELS  (unified flight + train journey model)
   Extendable: type can later be 'bus' | 'metro' | 'ferry' | 'car'
============================================================ */
function emptyPlace(){ return { name:'', code:'', icao:'', city:'', country:'', lat:null, lng:null }; }
function makeJourney(o){
  const base = {
    id: uid(), type:'flight', date:'', number:'', operator:'', operatorCode:'', category:'',
    from: emptyPlace(), to: emptyPlace(),
    scheduledDeparture:'', actualDeparture:'', scheduledArrival:'', actualArrival:'',
    durationMinutes:0, distanceKm:0, vehicle:'', registration:'', coach:'',
    seat:'', travelClass:'', bookingReference:'', notes:'', tripId:null, geometry:null
  };
  const j = Object.assign(base, o||{});
  j.from = Object.assign(emptyPlace(), o && o.from || {});
  j.to   = Object.assign(emptyPlace(), o && o.to || {});
  if (!j.category) j.category = j.type === 'train' ? 'rail' : 'air';
  return j;
}

function buildFromEntry(type, key, hit, date){
  const from = place(hit.f) || emptyPlace();
  const to = place(hit.t) || emptyPlace();
  const dist = type === 'train' ? railDistance(from, to, hit) : Math.round(haversine(from, to));
  const dur = hit.dur != null ? hit.dur : durFromTimes(hit.dep, hit.arr);
  const geo = hit.geo && RAIL_GEO[hit.geo] ? RAIL_GEO[hit.geo].map(p => p.slice()) : null;
  return makeJourney({
    type, date, number: hit.label || key, operator: hit.o || '', operatorCode: hit.c || '',
    category: type === 'train' ? (hit.cat || 'rail') : 'air',
    from, to,
    scheduledDeparture: String(hit.dep||'').replace('+1',''),
    scheduledArrival: String(hit.arr||'').replace('+1',''),
    durationMinutes: dur, distanceKm: dist,
    vehicle: hit.v || '', geometry: geo
  });
}

// Long-haul flights override durations; for trains estimate from rail geometry
// (polyline length ≈ real track distance) or a road/rail detour factor.
function railDistance(from, to, hit){
  let sum = 0;
  if (hit && hit.geo && RAIL_GEO[hit.geo]){
    const g = RAIL_GEO[hit.geo];
    for (let i=1;i<g.length;i++){
      sum += haversine({lat:g[i-1][1], lng:g[i-1][0]}, {lat:g[i][1], lng:g[i][0]});
    }
    return Math.round(sum * 1.05);
  }
  return Math.round(haversine(from, to) * 1.22);
}

  if (!m) return null;
  const candidates = [];
  candidates.push(key); // 用户输入的写法优先（adsbdb 同时索引 IATA / ICAO 两种呼号）
  if (m[1].length === 2 && IATA2ICAO[m[1]]) candidates.push(IATA2ICAO[m[1]] + m[2]);
  for (const cs of candidates){
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    try{
      const r = await fetch('https://api.adsbdb.com/v0/callsign/' + cs, { signal: ctrl.signal });
      const d = await r.json().catch(() => null);
      const fr = d && d.response && d.response.flightroute;
      if (fr && fr.origin && fr.destination && fr.origin.latitude != null && fr.destination.latitude != null){
        return buildFromRoute(fr);
      }
    }catch(e){ /* 超时 / 断网 / 未收录，尝试下一个候选 */ }
    finally{ clearTimeout(timer); }
  }
  return null;
}
function buildFromRoute(fr){
  // 在线结果统一翻译为中文（词典未命中的城市/国家保留原文）
  const ap = a => {
    const code = (a.iata_code || a.icao_code || '').toUpperCase();
    const cityEn = a.municipality || '';
    const city = zhCity(cityEn);
    return {
      name: AIRPORT_ZH[code] || (city !== cityEn ? city + '机场' : (a.name || '')),
      code, icao: a.icao_code || '', city,
      country: zhCountry(a.country_name), lat: a.latitude, lng: a.longitude
    };
  };
  const from = ap(fr.origin), to = ap(fr.destination);
  const dist = Math.round(haversine(from, to));
  return makeJourney({
    type: 'flight',
    operator: zhAirline(fr.airline ? fr.airline.name : ''),
    operatorCode: fr.airline ? (fr.airline.iata || fr.airline.icao || '') : '',
    category: 'air',
    from, to,
    distanceKm: dist,
    durationMinutes: Math.round(dist / 850 * 60) // 按 850 km/h 巡航估算，可手动修改
  });
}
// —— 手动修正表 ——
// adsbdb 存在「航季错配 / 方向反转 / 未收录」的情况；在此登记「航班号 → 正确起降」，
// 添加行程与启动加载时会自动覆盖在线结果。遇到查错或查不到的航班，往这里加一条即可。
const ROUTE_OVERRIDES = {
  // 'FR1655': {
  //   operator: '瑞安航空',
  //   duration: 200,
  //   from: { name:'机场名', code:'IATA', icao:'ICAO', city:'城市', country:'国家', lat:0, lng:0 },
  //   to:   { name:'机场名', code:'IATA', icao:'ICAO', city:'城市', country:'国家', lat:0, lng:0 }
  // }
};
function applyRouteOverride(j){
  if (!j) return j;
  const ov = ROUTE_OVERRIDES[normNum(j.number)];
  if (!ov) return j;
  j.from = Object.assign({}, ov.from);
  j.to = Object.assign({}, ov.to);
  if (ov.operator) j.operator = ov.operator;
  j.distanceKm = Math.round(haversine(j.from, j.to));
  j.durationMinutes = ov.duration || Math.round(j.distanceKm / 750 * 60); // 可手动修改
  if (ov.dep && !j.scheduledDeparture) j.scheduledDeparture = ov.dep;
  if (ov.arr && !j.scheduledArrival) j.scheduledArrival = ov.arr;
  return j;
}
async function resolveFlight(number, date){
  const key = normNum(number);
  if (!key) return null;
  const hit = FLIGHT_DB[key];
  if (hit) return buildFromEntry('flight', key, hit, date);
  try{
    const online = await adsbdbLookup(key);
    if (online){
      online.number = String(number).trim().toUpperCase(); // 保留用户输入的写法
      if (date) online.date = date;
      applyRouteOverride(online); // 手动修正表优先于在线数据
      try{ await applyAvstackTimes(online); }catch(e){ /* 时刻源失败不影响保存 */ }
      return online;
    }
  }catch(e){ /* 断网或接口异常，回落手动填写 */ }
  // 在线查不到、但已登记在修正表里的航班 → 直接按修正表构造
  if (ROUTE_OVERRIDES[key]){
    const j = makeJourney({ type: 'flight', number: String(number).trim().toUpperCase(), category: 'air' });
    applyRouteOverride(j);
    if (date) j.date = date;
    try{ await applyAvstackTimes(j); }catch(e){}
    return j;
  }
  return null;
}
async function resolveTrain(number, date, origin, destination){
  const key = normNum(number);
  if (!key) return null;
  const norm = TRAIN_DB_NORM[key];
  const hit = norm ? TRAIN_DB[norm] : null;
  if (!hit){
    // Future: return await fetchGTFS(key, date, origin, destination);
    return null;
  }
  return buildFromEntry('train', norm || key, hit, date);
}

}
function sortedJourneys(list, dir){
  const arr = (list || state.journeys).slice().sort((a,b) => (a.date||'').localeCompare(b.date||''));
  return dir === 'desc' ? arr.reverse() : arr;
}
function tripSegments(trip){

/* ============================================================
   GLOBE  (Globe.gl / three.js)
============================================================ */
let world = null, globeReady = false, rotateTimer = null;
const ringsLive = [];

function initGlobe(){
  const el = $('#globe-container');
  if (typeof Globe === 'undefined'){ showLibError(); return; }
  try{
    world = Globe({ animateIn:true, rendererConfig:{ powerPreference:'high-performance' } })(el)
      .globeImageUrl(TEX.night)
      .bumpImageUrl(TEX.bump)
      .backgroundImageUrl(TEX.stars)
      .atmosphereColor('#4d6bff')
      .atmosphereAltitude(0.17);

    // FLIGHT ROUTES — solid great-circle arcs (animation lives in Replay only)
    world
      .arcsData([])
      .arcColor('color')
      .arcStroke('stroke')
      .arcAltitude('altitude')
      .arcLabel(d => d.tip)
      .onArcClick(d => openJourneyDetail(d.j))
      .arcsTransitionDuration(1300);

    // TRAIN ROUTES — ground-hugging solid polylines (real geometry when available)
    world
      .pathsData([])
      .pathPoints('points')
      .pathPointLat(p => p[0])
      .pathPointLng(p => p[1])
      .pathPointAlt(p => p[2])
      .pathColor('color')
      .pathStroke('stroke')
      .pathLabel(d => d.tip)
      .onPathClick(d => openJourneyDetail(d.j))
      .pathTransitionDuration(1300);

    world
      .pointsData([])
      .pointsMerge(false)
      .pointLat(d => d.lat)
      .pointLng(d => d.lng)
      .pointColor(d => d.color)
      .pointAltitude(d => d.alt)
      .pointRadius(d => d.radius)
      .pointLabel(d => d.tip)
      .onPointClick(d => { const c = cityIndex[d.key]; if (c) focusCity(c, true); })
      .htmlElementsData([])
      .htmlLat(d => d.lat)
      .htmlLng(d => d.lng)
      .htmlAltitude(0.015)
      .htmlTransitionDuration(0)
      .htmlElement(d => {
        // 位图字体不含中文字形（会渲染成 ?），城市名改用真实 DOM 渲染
        const el = document.createElement('div');
        const txt = document.createElement('span');
        txt.className = 'city-label';
        txt.textContent = d.name;
        el.appendChild(txt);
        el.onclick = () => { const c = cityIndex[d.key]; if (c) focusCity(c, true); };
        return el;
      });

    world
      .ringsData([])
      .ringColor('color')
      .ringMaxRadius(d => d.maxR)
      .ringPropagationSpeed(d => d.speed)
      .ringRepeatPeriod(d => d.repeat);

    const ctr = world.controls();
    ctr.enableDamping = true;
    ctr.dampingFactor = 0.08;
    ctr.autoRotate = state.settings.autoRotate;
    ctr.autoRotateSpeed = 0.35;
    ctr.minDistance = 175;
    ctr.maxDistance = 620;
    ctr.addEventListener('start', () => { setAutoRotate(false); });
    ctr.addEventListener('end', () => { queueAutoRotate(); });

    // 提亮夜间地球贴图，避免深色背景吃掉城市灯光细节
    if (typeof THREE !== 'undefined' && world.globeMaterial()){
      world.globeMaterial().color.setRGB(1.35, 1.4, 1.55);
    }
    // 像素比限制到 1.5，高分屏流畅度优先
    if (world.renderer && world.renderer()) world.renderer().setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

    onResize();
    world.pointOfView({ lat: 26, lng: 8, altitude: 2.75 }, 0);
    globeReady = true;
    updateGlobeLayers();
    setTimeout(bootDone, 500);
  }catch(err){
    console.error('globe init failed', err);
    showLibError();
  }
}
function setAutoRotate(on){
  if (!world) return;
  world.controls().autoRotate = on && state.settings.autoRotate;
}
function queueAutoRotate(){
  clearTimeout(rotateTimer);
  rotateTimer = setTimeout(() => setAutoRotate(true), 6000);
}
function onResize(){
  if (!world) return;
  const el = $('#globe-container');
  if (el.clientWidth && el.clientHeight){
    world.width(el.clientWidth).height(el.clientHeight);
  }
}
function showLibError(){
  $('#boot').classList.add('done');
  $('#globe-error').classList.remove('hidden');
  const empty = $('#empty-state');
  if (empty) empty.classList.add('hidden');
}

/* ============================================================
   FLIGHT ROUTES + TRAIN ROUTES — layer builders
============================================================ */
let cityIndex = {};
const FLIGHT_C = ['#5f86ff', '#9a6bff'];
const TRAIN_C  = ['#ffca6e', '#f2ad4f'];
const CITY_C   = 'rgba(159,177,255,0.95)';

function validGeo(p){ return p && isFinite(p.lat) && isFinite(p.lng); }

function flightTip(j){
  return '<b>' + esc(j.number) + '</b> ' + esc(j.operator||'') + '<br>' +
    esc(j.from.city || j.from.code) + ' → ' + esc(j.to.city || j.to.code) +
    (j.distanceKm ? ' · ' + fmtKm(j.distanceKm) : '');
}
function trainTip(j){
  return '<b>' + esc(j.number) + '</b> ' + esc(j.operator||'') + '<br>' +
    esc(j.from.name || j.from.city) + ' → ' + esc(j.to.name || j.to.city) +
    (j.distanceKm ? ' · ' + fmtKm(j.distanceKm) : '');
}

// Build the train polyline: real geometry when present, otherwise a
// surface-hugging great-circle polyline between the two stations.
function trainPathPoints(j){
  const pts = [];
  if (Array.isArray(j.geometry) && j.geometry.length > 1){
    j.geometry.forEach(pair => {
      const lng = pair[0], lat = pair[1];
      if (isFinite(lat) && isFinite(lng)) pts.push([lat, lng, 0.002]);
    });
  }
  if (pts.length < 2 && validGeo(j.from) && validGeo(j.to)){
    const n = clamp(Math.round(haversine(j.from, j.to) / 140), 12, 48);
    for (let i=0;i<=n;i++){
      const p = slerpLL(j.from.lat, j.from.lng, j.to.lat, j.to.lng, i/n);
      pts.push([p.lat, p.lng, 0.002]);
    }
  }
  return pts;
}

function buildCityIndex(){
  cityIndex = {};
  visibleJourneys().forEach(j => {
    [[j.from, j.type], [j.to, j.type]].forEach(([p]) => {
      if (!p || !p.city) return;
      const key = (p.city + '|' + (p.country||'')).toLowerCase();
      let c = cityIndex[key];
      if (!c){
        c = cityIndex[key] = { key, name:p.city, country:p.country||'', lat:0, lng:0, n:0,
          visits:0, flights:0, trains:0, first:null, last:null, journeys:[] };
      }
      if (validGeo(p)){ c.lat += p.lat; c.lng += p.lng; c.n++; }
    });
    const keys = new Set();
    [j.from, j.to].forEach(p => { if (p && p.city) keys.add((p.city + '|' + (p.country||'')).toLowerCase()); });
    keys.forEach(k => {
      const c = cityIndex[k]; if (!c) return;
      c.visits++;
      if (j.type === 'flight') c.flights++; else c.trains++;
      if (j.date && (!c.first || j.date < c.first)) c.first = j.date;
      if (j.date && (!c.last || j.date > c.last)) c.last = j.date;
      c.journeys.push(j);
    });
  });
  Object.values(cityIndex).forEach(c => {
    if (c.n){ c.lat /= c.n; c.lng /= c.n; }
  });
}

function updateGlobeLayers(){
  if (!world) return;
  const s = state.settings;
  const vis = visibleJourneys();

  const flights = s.showFlights ? vis.filter(j => j.type === 'flight' && validGeo(j.from) && validGeo(j.to)) : [];
  const trains  = s.showTrains  ? vis.filter(j => j.type === 'train'  && validGeo(j.from) && validGeo(j.to)) : [];

  // 主界面航线为完整实线；动画只在回放里出现
  const arcs = flights.map(j => ({
    j, startLat:j.from.lat, startLng:j.from.lng, endLat:j.to.lat, endLng:j.to.lng,
    altitude: 0.012 + clamp(0.03 + haversine(j.from, j.to) / 34000, 0.10, 0.30),
    color: FLIGHT_C, stroke: isMobile() ? 0.2 : 0.3,
    tip: flightTip(j)
  }));
  world.arcsData(arcs);

  world.pathsData(trains.map(j => ({
    j, points: trainPathPoints(j),
    color: TRAIN_C, stroke: isMobile() ? 0.5 : 0.65,
    tip: trainTip(j)
  })));

  // City + infrastructure nodes
  const nodes = [];
  Object.values(cityIndex).forEach(c => {
    if (!c.n) return;
    nodes.push({
      kind:'city', key:c.key, lat:c.lat, lng:c.lng, color:CITY_C,
      alt: 0.011, radius: 0.24 + Math.log2(c.visits + 1) * 0.055,
      tip: '<b>' + esc(c.name) + '</b> · 到访 ' + c.visits + ' 次'
    });
  });
  const placeCount = {};
  vis.forEach(j => {
    [j.from, j.to].forEach(p => {
      if (p && p.code){ const k = p.code; placeCount[k] = (placeCount[k]||0) + 1; }
    });
  });
  Object.entries(placeCount).forEach(([code, n]) => {
    const p = PLACES[code]; if (!p) return;
    if (p.kind === 'airport' && !s.showAirports) return;
    if (p.kind === 'station' && !s.showStations) return;
    nodes.push({
      kind:'node', key:(p.city + '|' + (p.country||'')).toLowerCase(), lat:p.lat, lng:p.lng,
      color: p.kind === 'airport' ? 'rgba(120,140,190,0.6)' : 'rgba(196,164,110,0.6)',
      alt: 0.007, radius: 0.07 + Math.min(n, 8) * 0.008,
      tip: '<b>' + esc(p.code) + '</b> ' + esc(p.name)
    });
  });
  world.pointsData(nodes);

  const cities = Object.values(cityIndex).filter(c => c.n);
  world.htmlElementsData(s.showCityLabels ? cities.map(c => ({
    key:c.key, lat:c.lat, lng:c.lng, name:c.name
  })) : []);
}

/* ---- camera helpers ---- */
function flyTo(lat, lng, alt, ms){
  if (!world) return;
  world.pointOfView({ lat, lng, altitude: alt }, ms == null ? 1000 : ms);
}
function ringAt(lat, lng, color, timeout){
  if (!world) return;
  const r = { lat, lng, color, maxR: 3.6, speed: 1.6, repeat: 1300 };
  ringsLive.push(r);
  world.ringsData(ringsLive.slice());
  setTimeout(() => {
    const i = ringsLive.indexOf(r);
    if (i >= 0){ ringsLive.splice(i, 1); world.ringsData(ringsLive.slice()); }
  }, timeout || 2800);
}
// Timeline interaction inspired by AirTrail: locate a record on the map.
function focusJourney(j, openCard){
  if (!validGeo(j.from) || !validGeo(j.to)){ if (openCard !== false) openJourneyDetail(j); return; }
  switchView('globe');
  const mid = slerpLL(j.from.lat, j.from.lng, j.to.lat, j.to.lng, 0.5);
  const dist = haversine(j.from, j.to);
  const alt = clamp(0.85 + dist / 9000 * 0.95, 0.85, 2.3);
  const col = j.type === 'flight' ? 'rgba(120,150,255,0.85)' : 'rgba(255,203,110,0.85)';
  flyTo(mid.lat, mid.lng, alt, 1100);
  ringAt(j.from.lat, j.from.lng, col, 3200);
  ringAt(j.to.lat, j.to.lng, col, 3200);
  if (openCard !== false) setTimeout(() => openJourneyDetail(j, { fly:false }), 1150);
}
function focusCity(city, openCard){
  switchView('globe');
  flyTo(city.lat, city.lng, 0.62, 950);
  ringAt(city.lat, city.lng, 'rgba(159,177,255,0.85)', 3000);
  if (openCard) setTimeout(() => openCityCard(city), 850);
}
function zoomBy(f){
  if (!world) return;
  const pov = world.pointOfView();
  flyTo(pov.lat, pov.lng, clamp(pov.altitude * f, 0.75, 5.2), 220);
}

/* ============================================================
   2D MAP VIEW (equirectangular canvas — shares the same data)
============================================================ */
const MAP = { img:null, ready:false, zoom:1, panX:0, panY:0, raf:0, active:false,
  pointers:new Map(), pinchD:0, hover:null };

function initMap(){
  const c = $('#map-canvas');
  MAP.canvas = c;
  MAP.ctx = c.getContext('2d');
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { MAP.img = img; MAP.ready = true; };
  img.src = TEX.night;

  c.addEventListener('pointerdown', e => {
    c.setPointerCapture(e.pointerId);
    MAP.pointers.set(e.pointerId, { x:e.offsetX, y:e.offsetY });
    if (MAP.pointers.size === 2){
      const p = Array.from(MAP.pointers.values());
      MAP.pinchD = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
    }
  });
  c.addEventListener('pointermove', e => {
    const prev = MAP.pointers.get(e.pointerId);
    if (prev && MAP.pointers.size === 1){
      MAP.panX += e.offsetX - prev.x;
      MAP.panY += e.offsetY - prev.y;
    } else if (prev && MAP.pointers.size === 2){
      MAP.pointers.set(e.pointerId, { x:e.offsetX, y:e.offsetY });
      const p = Array.from(MAP.pointers.values());
      const d = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      if (MAP.pinchD > 0) MAP.zoom = clamp(MAP.zoom * (d / MAP.pinchD), 1, 14);
      MAP.pinchD = d;
    }
    if (prev) MAP.pointers.set(e.pointerId, { x:e.offsetX, y:e.offsetY });
    else mapHover(e.offsetX, e.offsetY);
  });
  let downAt = null;
  c.addEventListener('pointerdown', e => { downAt = { x:e.offsetX, y:e.offsetY }; });
  const up = e => {
    if (downAt && MAP.pointers.size <= 1 && Math.hypot(e.offsetX - downAt.x, e.offsetY - downAt.y) < 6) mapClick(e.offsetX, e.offsetY);
    downAt = null;
    MAP.pointers.delete(e.pointerId);
    MAP.pinchD = 0;
  };
  c.addEventListener('pointerup', up);
  c.addEventListener('pointercancel', up);
  c.addEventListener('pointerleave', () => { MAP.hover = null; $('#map-tip').classList.add('hidden'); });
  c.addEventListener('wheel', e => {
    e.preventDefault();
    const oldK = mapK();
    const lng = (e.offsetX - mapCX()) / oldK;
    const lat = (mapCY() - e.offsetY) / oldK;
    MAP.zoom = clamp(MAP.zoom * Math.exp(-e.deltaY * 0.0016), 1, 14);
    const k = mapK();
    MAP.panX = e.offsetX - mapCX0() - lng * k;
    MAP.panY = e.offsetY - mapCY0() + lat * k;
  }, { passive:false });
}
function mapDPR(){ return Math.min(window.devicePixelRatio || 1, 2); }
function mapK0(){
  const r = MAP.canvas.getBoundingClientRect();
  return Math.min(r.width/360, r.height/180);
}
function mapK(){ return mapK0() * MAP.zoom; }
function mapCX0(){ return MAP.canvas.getBoundingClientRect().width/2; }
function mapCY0(){ return MAP.canvas.getBoundingClientRect().height/2; }
function mapCX(){ return mapCX0() + MAP.panX; }
function mapCY(){ return mapCY0() + MAP.panY; }

function mapResize(){
  const c = MAP.canvas, dpr = mapDPR();
  const r = c.getBoundingClientRect();
  c.width = Math.round(r.width * dpr);
  c.height = Math.round(r.height * dpr);
}
function mapLoop(){
  if (!MAP.active) return;
  drawMap();
  MAP.raf = requestAnimationFrame(mapLoop);
}
function drawMap(){
  if (!MAP.canvas || !MAP.active) return;
  const ctx = MAP.ctx, dpr = mapDPR();
  const r = MAP.canvas.getBoundingClientRect();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle = '#07080c';
  ctx.fillRect(0,0,r.width,r.height);
  const k = mapK(), cx = mapCX(), cy = mapCY();

  if (MAP.ready){
    ctx.drawImage(MAP.img, cx - 180*k, cy - 90*k, 360*k, 180*k);
    ctx.fillStyle = 'rgba(5,6,10,0.25)';
    ctx.fillRect(cx - 180*k, cy - 90*k, 360*k, 180*k);
  }
  // graticule
  ctx.strokeStyle = 'rgba(255,255,255,0.045)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let g=-150; g<=150; g+=30){ const x = cx + g*k; ctx.moveTo(x, cy-90*k); ctx.lineTo(x, cy+90*k); }
  for (let g=-60; g<=60; g+=30){ const y = cy - g*k; ctx.moveTo(cx-180*k, y); ctx.lineTo(cx+180*k, y); }
  ctx.stroke();
  const frame = () => { ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.strokeRect(cx-180*k, cy-90*k, 360*k, 180*k); };
  frame();

  const P = (lat,lng) => [cx + lng*k, cy - lat*k];
  const vis = visibleJourneys();
  const s = state.settings;

  // routes
  vis.forEach(j => {
    if (!validGeo(j.from) || !validGeo(j.to)) return;
    if (j.type === 'flight' && !s.showFlights) return;
    if (j.type === 'train' && !s.showTrains) return;
    const [x0,y0] = P(j.from.lat, j.from.lng);
    const [x1,y1] = P(j.to.lat, j.to.lng);
    ctx.lineWidth = j.type === 'flight' ? 1.1 : 1.7;
    ctx.strokeStyle = j.type === 'flight' ? 'rgba(122,150,255,0.5)' : 'rgba(255,201,102,0.65)';
    ctx.beginPath();
    if (j.type === 'flight'){
      const mx=(x0+x1)/2, my=(y0+y1)/2;
      const dx=x1-x0, dy=y1-y0, len=Math.hypot(dx,dy)||1;
      let nx=-dy/len, ny=dx/len;
      if (ny > 0){ nx=-nx; ny=-ny; }
      const off = clamp(len*0.22, 4, 90);
      ctx.moveTo(x0,y0);
      ctx.quadraticCurveTo(mx+nx*off, my+ny*off, x1,y1);
    } else {
      const pts = trainPathPoints(j);
      pts.forEach((p,i) => { const [x,y] = P(p[0],p[1]); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
    }
    ctx.stroke();
  });

  // nodes
  Object.values(cityIndex).forEach(c => {
    if (!c.n) return;
    const [x,y] = P(c.lat, c.lng);
    const rad = 2.2 + Math.log2(c.visits+1)*1.4;
    ctx.beginPath();
    ctx.arc(x,y,rad+3,0,7);
    ctx.fillStyle = 'rgba(159,177,255,0.12)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x,y,rad,0,7);
    ctx.fillStyle = 'rgba(170,186,255,0.95)';
    ctx.fill();
    if (s.showCityLabels && (c.visits >= 3 || MAP.zoom > 2.2)){
      ctx.font = '600 10px Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial';
      ctx.fillStyle = 'rgba(233,236,244,0.82)';
      ctx.textAlign = 'center';
      ctx.fillText(c.name.toUpperCase(), x, y - rad - 6);
    }
  });
}
function mapCityAt(mx, my){
  const k = mapK(), cx = mapCX(), cy = mapCY();
  let best = null, bd = 16;
  Object.values(cityIndex).forEach(c => {
    if (!c.n) return;
    const d = Math.hypot(mx - (cx + c.lng*k), my - (cy - c.lat*k));
    if (d < bd){ bd = d; best = c; }
  });
  return best;
}
function mapHover(mx, my){
  const c = mapCityAt(mx, my);
  const tip = $('#map-tip');
  if (c){
    MAP.hover = c;
    tip.innerHTML = '<b>' + esc(c.name) + '</b><span>到访 ' + c.visits + ' 次</span>';
    tip.style.left = mx + 'px';
    tip.style.top = my + 'px';
    tip.classList.remove('hidden');
  } else {
    MAP.hover = null;
    tip.classList.add('hidden');
  }
}
function mapClick(mx, my){
  if (MAP.pointers.size > 0) return;
  const c = mapCityAt(mx, my);
  if (c) focusCity(c, true);
}

const tlFilter = { year:'', month:'', mode:'', country:'', city:'', operator:'' };

function timelineList(){
  return sortedJourneys(state.journeys, 'desc').filter(j => {
    if (tlFilter.year && String(yearOf(j)) !== tlFilter.year) return false;
    if (tlFilter.month !== '' && String(monthOf(j)) !== tlFilter.month) return false;
    if (tlFilter.mode && j.type !== tlFilter.mode) return false;
    if (tlFilter.country && j.from.country !== tlFilter.country && j.to.country !== tlFilter.country) return false;
    if (tlFilter.city && j.from.city !== tlFilter.city && j.to.city !== tlFilter.city) return false;
    if (tlFilter.operator && j.operator !== tlFilter.operator) return false;
    return true;
  });
}
function renderTimeline(){
  // populate filter options once per data change
  const all = sortedJourneys(state.journeys, 'desc');
  const opts = {
    year: [...new Set(all.map(yearOf).filter(Boolean))].sort((a,b)=>b-a),
    country: [...new Set(all.flatMap(j => [j.from.country, j.to.country]).filter(Boolean))].sort(),
    city: [...new Set(all.flatMap(j => [j.from.city, j.to.city]).filter(Boolean))].sort(),
    operator: [...new Set(all.map(j => j.operator).filter(Boolean))].sort()
  };
  $$('#tl-filters select').forEach(sel => {
    const f = sel.dataset.f;
    const cur = tlFilter[f];
    if (f === 'month'){
      if (sel.options.length === 1) MONTHS.forEach((m,i) => sel.add(new Option(m, String(i))));
      sel.value = cur;
      if (sel.value !== cur){ tlFilter[f] = ''; sel.value = ''; }
      return;
    }
    if (f === 'mode'){ // static options, just restore selection
      sel.value = cur;
      if (sel.value !== cur){ tlFilter[f] = ''; sel.value = ''; }
      return;
    }
    sel.innerHTML = '<option value="">' + ({year:'全部年份',country:'全部国家',city:'全部城市',operator:'全部运营商'}[f]) + '</option>' +
      opts[f].map(v => '<option value="' + esc(v) + '">' + esc(f === 'year' ? v : v) + '</option>').join('');
    sel.value = cur;
    if (sel.value !== cur){ tlFilter[f] = ''; sel.value = ''; }
  });

  const list = timelineList();
  const root = $('#tl-list');
  $('#tl-count').textContent = list.length + ' / ' + all.length + ' 段行程';
  if (!list.length){
    root.innerHTML = '<div class="tl-empty">' + (state.journeys.length ? '没有符合筛选条件的行程。' : '你的世界正在等你。添加你的第一段行程。') + '</div>';
    return;
  }
  let html = '', lastDate = null;
  list.forEach(j => {
    if (j.date !== lastDate){
      if (lastDate !== null) html += '</div>';
